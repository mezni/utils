version: "3.9"

services:
  postgis:
    image: postgis/postgis:15-3.3
    container_name: borne-map-postgis
    environment:
      POSTGRES_USER: borne
      POSTGRES_PASSWORD: borne
      POSTGRES_DB: borne_map
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U borne -d borne_map"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
