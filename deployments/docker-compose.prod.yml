version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: bornemap_db_prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bornemap_prod
    ports:
      - "5432:5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    networks:
      - bornemap_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d bornemap_prod"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api-service:
    build: ../backend
    container_name: bornemap_api_prod
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/bornemap_prod
      API_PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
      RUST_LOG: info
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bornemap_network
    restart: unless-stopped

volumes:
  pgdata_prod:

networks:
  bornemap_network:
    driver: bridge
