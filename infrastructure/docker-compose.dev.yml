services:
  core-service:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile
      target: builder
    ports:
      - "8080:8080"
    environment:
      - API_PORT=8080
      - JWT_SECRET=dev_secret
      - LOG_LEVEL=debug
      - LOG_FORMAT=json
    volumes:
      - ..:/app
      - cargo-cache:/usr/local/cargo/registry
    command: cargo run -p core-service

volumes:
  cargo-cache:
