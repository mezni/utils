# Redis Configuration for BorneMap

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence
save 900 1
save 300 10
save 60 10000

# Security
requirepass bornemap_redis_password

# Network
bind 0.0.0.0
port 6379
tcp-backlog 511

# Logging
loglevel notice
logfile /var/log/redis/redis-server.log

# Performance
timeout 300
tcp-keepalive 60

# Keyspace events (for pub/sub)
notify-keyspace-events "Ex"

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128
