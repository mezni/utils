services:
  # Keycloak identity provider
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: bornemap_keycloak
    command: start --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak_admin
      KC_DB_PASSWORD: keycloak_password
      KC_HOSTNAME: localhost
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
    ports:
      - "8080:8080"
    volumes:
      - ../../infrastructure/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/realms/bornemap"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - bornemap-network

  # PostgreSQL for Keycloak
  keycloak-db:
    image: postgres:16-alpine
    container_name: bornemap_keycloak_db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak_admin
      POSTGRES_PASSWORD: keycloak_password
    ports:
      - "5434:5432"
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak_admin"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bornemap-network

  # PostgreSQL for platform_db (users, gis, inventory)
  # PostgreSQL for platform_db (users, gis, inventory)
  platform-db:
    image: postgres:16-alpine
    container_name: bornemap_platform_db
    environment:
      POSTGRES_DB: platform_db
      POSTGRES_USER: bornemap_admin
      POSTGRES_PASSWORD: bornemap_password
    ports:
      - "5432:5432"
    volumes:
      - platform_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bornemap_admin"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bornemap-network

  # PostgreSQL for analytics_db
  analytics-db:
    image: postgres:16-alpine
    container_name: bornemap_analytics_db
    environment:
      POSTGRES_DB: analytics_db
      POSTGRES_USER: bornemap_analytics_writer
      POSTGRES_PASSWORD: bornemap_password
    ports:
      - "5433:5432"
    volumes:
      - analytics_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bornemap_analytics_writer"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bornemap-network

  # Redis (optional, for caching)
  redis:
    image: redis:7-alpine
    container_name: bornemap_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bornemap-network

  # Auth service (port 3000)
  auth-service:
    build:
      context: ../../
      dockerfile: services/auth-service/Dockerfile
    container_name: bornemap_auth_service
    ports:
      - "3000:3000"
    depends_on:
      platform-db:
        condition: service_healthy
    environment:
      - RUST_LOG=info
      - APP_SERVER_PORT=3000
      - APP_DATABASE_URL=postgres://bornemap_admin:bornemap_password@platform-db:5432/platform_db
    networks:
      - bornemap-network

  # Driver service (port 3001)
  driver-service:
    build:
      context: ../../
      dockerfile: services/driver-service/Dockerfile
    container_name: bornemap_driver_service
    ports:
      - "3001:3001"
    depends_on:
      platform-db:
        condition: service_healthy
      analytics-db:
        condition: service_healthy
    environment:
      - RUST_LOG=info
      - APP_SERVER_PORT=3001
      - APP_DATABASE_URL=postgres://bornemap_driver:bornemap_password@platform-db:5432/platform_db
      - APP_ANALYTICS_DATABASE_URL=postgres://bornemap_analytics_writer:bornemap_password@analytics-db:5432/analytics_db
    networks:
      - bornemap-network

  # Admin service (port 3002)
  admin-service:
    build:
      context: ../../
      dockerfile: services/admin-service/Dockerfile
    container_name: bornemap_admin_service
    ports:
      - "3002:3002"
    depends_on:
      platform-db:
        condition: service_healthy
    environment:
      - RUST_LOG=info
      - APP_SERVER_PORT=3002
      - APP_DATABASE_URL=postgres://bornemap_admin:bornemap_password@platform-db:5432/platform_db
    networks:
      - bornemap-network

volumes:
  platform_db_data:
  analytics_db_data:
  redis_data:
  keycloak_db_data:

networks:
  bornemap-network:
    driver: bridge