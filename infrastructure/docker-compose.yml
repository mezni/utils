services:
  postgres:
    build:
      context: ..
      dockerfile: infrastructure/docker/postgres/Dockerfile
    container_name: bornemap-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: bornemap
      POSTGRES_PASSWORD: bomeapassword
      POSTGRES_DB: bornemap
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bornemap"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  admin-service:
    build:
      context: ..
      dockerfile: infrastructure/docker/admin-service/Dockerfile
    container_name: bornemap-admin-service
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://bornemap:bomeapassword@postgres:5432/bornemap
      - RUST_LOG=info
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  admin-dashboard:
    build:
      context: ..
      dockerfile: infrastructure/docker/admin-dashboard/Dockerfile
    container_name: bornemap-admin-dashboard
    ports:
      - "3000:80"
    depends_on:
      - admin-service
    restart: unless-stopped

volumes:
  postgres_data:
