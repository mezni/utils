version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: bornemap_dev_db
    environment:
      POSTGRES_DB: bornemap_dev
      POSTGRES_USER: bornemap_admin
      POSTGRES_PASSWORD: development_secret_key
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bornemap_admin -d bornemap_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-api:
    build:
      context: ./sources/backend
      dockerfile: Dockerfile.dev
    container_name: bornemap_dev_api
    volumes:
      - ./sources/backend:/app
      - cargo_cache:/usr/local/cargo/registry
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://bornemap_admin:development_secret_key@postgres:5432/bornemap_dev
      - RUST_LOG=actix_web=info,bornemap_backend=debug
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_dev_data:
    driver: local
  cargo_cache:
    driver: local
