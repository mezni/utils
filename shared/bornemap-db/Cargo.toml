[package]
name = "bornemap-db"
version = "0.1.0"
edition = "2024"

[dependencies]
bornemap-core = { path = "../bornemap-core" }
redis = { version = "0.24", features = ["default"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "migrate"] }
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }