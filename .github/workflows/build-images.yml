name: Build & Publish Container Images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  CARGO_TERM_COLOR: always

jobs:
  login:
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ env.REGISTRY }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: login
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - admin-service
          - driver-service
          - clickstream-service
          - gis-sync-worker
          - driver-web
          - admin-dashboard
          - partner-dashboard
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Dockerfile path
        id: dockerfile
        run: |
          if [ -f "apps/${{ matrix.service }}/Dockerfile" ]; then
            echo "path=apps/${{ matrix.service }}/Dockerfile" >> $GITHUB_OUTPUT
          else
            echo "path=infra/docker/${{ matrix.service }}.Dockerfile" >> $GITHUB_OUTPUT
          fi

      - name: Determine tags
        id: tags
        run: |
          TAGS="${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:sha-${{ github.sha }}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAGS="$TAGS,${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:${{ github.ref_name }}"
          fi
          if [[ "${{ github.ref }}" == refs/heads/main ]]; then
            TAGS="$TAGS,${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:latest"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.path }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  duration-report:
    if: always()
    needs: [login, build]
    runs-on: ubuntu-latest
    steps:
      - name: Record workflow start
        run: echo "start_time=$(date +%s)" >> $GITHUB_ENV

      - name: Report build duration
        run: |
          end_time=$(date +%s)
          elapsed=$((end_time - ${start_time:-end_time}))
          echo "## Build Duration" >> $GITHUB_STEP_SUMMARY
          echo "Total elapsed: ${elapsed}s ($((elapsed / 60))m $((elapsed % 60))s)" >> $GITHUB_STEP_SUMMARY
          echo "Target: < 20 minutes (FR-017)" >> $GITHUB_STEP_SUMMARY
          if [ $elapsed -gt 1200 ]; then
            echo "⚠️ Exceeded 20-minute target" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ Within target" >> $GITHUB_STEP_SUMMARY
          fi
