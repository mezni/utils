name: Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-test:
    name: Rust Check & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_password_change_me
          POSTGRES_DB: bornemap_dev
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v3
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "backend -> target"
      - name: Format Check
        run: cd backend && cargo fmt --all -- --check
      - name: Compile Verification
        run: cd backend && cargo check --workspace
      - name: Execute Tests
        run: cd backend && cargo test --workspace
        env:
          DATABASE_URL: postgres://postgres:local_password_change_me@localhost:5432/bornemap_dev

  frontend-test:
    name: Expo Client Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: apps/mobile-driver/package.json
      - name: Install Dependencies
        run: cd apps/mobile-driver && npm ci
      - name: Build Verification
        run: cd apps/mobile-driver && npx expo export --platform web
