name: Stale Branches

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        id: scan
        with:
          script: |
            const octokit = github.rest;
            const { repo, owner } = context.repo;

            const THIRTY_DAYS_MS = 30 * 24 * 60 * 60 * 1000;
            const now = Date.now();

            // List all branches
            const branches = await octokit.paginate(octokit.repos.listBranches, {
              owner, repo, per_page: 100,
            });

            const staleBranches = [];

            for (const branch of branches) {
              if (branch.name === 'main') continue;

              // Get the branch details to find last commit date
              const { data: branchData } = await octokit.repos.getBranch({
                owner, repo, branch: branch.name,
              });
              const lastCommitDate = new Date(branchData.commit.commit.author.date).getTime();
              const ageDays = (now - lastCommitDate) / (1000 * 60 * 60 * 24);

              if (ageDays <= 30) continue;

              // Check for open PRs on this branch
              const { data: prs } = await octokit.pulls.list({
                owner, repo,
                head: `${owner}:${branch.name}`,
                state: 'open',
              });

              if (prs.length > 0) continue;

              staleBranches.push({
                name: branch.name,
                author: branchData.commit.commit.author.name,
                lastCommit: branchData.commit.commit.author.date,
                ageDays: Math.round(ageDays),
              });
            }

            const issueTitle = 'Stale Branch Report';
            const label = 'stale-branch';

            // Find existing stale-branch issue
            const { data: issues } = await octokit.issues.listForRepo({
              owner, repo, labels: label, state: 'open', per_page: 1,
            });

            let body;
            if (staleBranches.length === 0) {
              body = '## Stale Branch Report\n\nNo stale branches found. All branches have recent activity or open pull requests.';
            } else {
              body = '## Stale Branch Report\n\n';
              body += '| Branch | Author | Last Commit | Age (days) |\n';
              body += '|--------|--------|-------------|------------|\n';
              for (const b of staleBranches) {
                body += `| ${b.name} | ${b.author} | ${b.lastCommit} | ${b.ageDays} |\n`;
              }
            }

            if (issues.length > 0) {
              await octokit.issues.update({
                owner, repo, issue_number: issues[0].number, body,
              });
            } else {
              await octokit.issues.create({
                owner, repo, title: issueTitle, body, labels: [label],
              });
            }
