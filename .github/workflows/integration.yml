name: Integration Validation

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: integration-main
  cancel-in-progress: true

env:
  COMPOSE_FILE: infra/compose/docker-compose.yml:infra/compose/docker-compose.dev.yml

jobs:
  runtime-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env with dev defaults
        run: |
          cp infra/compose/.env.example .env 2>/dev/null || cat > .env << 'EOF'
          POSTGRES_USER=borne
          POSTGRES_PASSWORD=devpassword
          POSTGRES_DB=borne_map
          RABBITMQ_USER=guest
          RABBITMQ_PASSWORD=guest
          KEYCLOAK_ADMIN_PASSWORD=admin
          DATABASE_URL=postgres://borne:devpassword@postgres:5432/borne_map
          RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
          KEYCLOAK_URL=http://keycloak:8080
          KEYCLOAK_REALM=borne-map
          KEYCLOAK_CLIENT_ID=backend-service
          RUST_LOG=info,json
          ENVIRONMENT=local
          EOF
          echo "Created .env file"

      - name: Start platform stack
        run: docker compose up -d --wait --wait-timeout 300

      - name: List running services
        run: docker compose ps

  health-verify:
    needs: runtime-boot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for all services to be healthy
        run: |
          endpoints="
            http://localhost:80/health
            http://postgres:5432
            http://rabbitmq:15672/api/health/checks/alarms
            http://keycloak:8080/health/ready
            http://admin-service:8081/health
            http://driver-service:8082/health
            http://clickstream-service:8083/health
            http://gis-sync-worker:8084/health
            http://driver-web:3000/
            http://admin-dashboard:3001/
            http://partner-dashboard:3002/
          "
          for ep in $endpoints; do
            echo "Checking $ep..."
            for i in $(seq 1 30); do
              if curl -sf "$ep" > /dev/null 2>&1; then
                echo "  OK ($i/30)"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "  FAILED after 30 retries"
                exit 1
              fi
              sleep 10
            done
          done
          echo "All health endpoints pass."

  api-contract-check:
    needs: health-verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate /api/v1/* routing
        run: |
          versioned_paths="
            /api/v1/stations
            /api/v1/drivers
            /api/v1/partners
            /api/v1/chargers
            /api/v1/reviews
            /api/v1/events
          "
          for path in $versioned_paths; do
            echo "Checking $path..."
            status=$(curl -so /dev/null -w "%{http_code}" "http://localhost:80$path" || true)
            if [ "$status" = "000" ] || [ "$status" = "" ]; then
              echo "  WARN: $path returned $status (service may not be reachable yet)"
            else
              echo "  HTTP $status"
            fi
          done

      - name: Verify unversioned paths return 404
        run: |
          unversioned_paths="
            /api/stations
            /api/drivers
            /api/partners
          "
          for path in $unversioned_paths; do
            echo "Checking $path should return 404..."
            status=$(curl -so /dev/null -w "%{http_code}" "http://localhost:80$path" || true)
            if [ "$status" = "404" ] || [ "$status" = "000" ]; then
              echo "  OK: $status"
            else
              echo "  WARN: $path returned $status (expected 404)"
            fi
          done

  cross-service-test:
    needs: health-verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate DB connectivity
        run: |
          docker compose exec -T postgres pg_isready -U borne -d borne_map
          echo "DB connectivity OK"

      - name: Validate RabbitMQ publish/consume
        run: |
          docker compose exec -T rabbitmq rabbitmq-diagnostics status
          echo "RabbitMQ connectivity OK"

      - name: Validate Keycloak auth token flow
        run: |
          TOKEN=$(curl -s -X POST http://localhost:8080/realms/borne-map/protocol/openid-connect/token \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "username=admin" \
            -d "password=admin" \
            -d "grant_type=password" \
            -d "client_id=backend-service" \
            -d "client_secret=" 2>/dev/null)
          if echo "$TOKEN" | grep -q "access_token"; then
            echo "Keycloak auth flow OK — access token received"
          else
            echo "WARN: Keycloak auth flow may need configuration"

  duration-report:
    if: always()
    needs: [runtime-boot, health-verify, api-contract-check, cross-service-test]
    runs-on: ubuntu-latest
    steps:
      - name: Record workflow start
        run: echo "start_time=$(date +%s)" >> $GITHUB_ENV

      - name: Report integration duration
        run: |
          end_time=$(date +%s)
          elapsed=$((end_time - ${start_time:-end_time}))
          echo "## Integration Validation Duration" >> $GITHUB_STEP_SUMMARY
          echo "Total elapsed: ${elapsed}s ($((elapsed / 60))m $((elapsed % 60))s)" >> $GITHUB_STEP_SUMMARY
          echo "Target: < 25 minutes (FR-017)" >> $GITHUB_STEP_SUMMARY
          if [ $elapsed -gt 1500 ]; then
            echo "⚠️ Exceeded 25-minute target" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ Within target" >> $GITHUB_STEP_SUMMARY
          fi
          fi
