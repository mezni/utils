name: CI - Driver Web

on:
  push:
    paths:
      - 'apps/driver-web/**'
      - 'packages/**'
  pull_request:
    paths:
      - 'apps/driver-web/**'
      - 'packages/**'

jobs:
  test:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/driver-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        id: npm-cache
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}

      - run: npm install
        working-directory: .

      - run: npm run lint
      - run: npm run build
