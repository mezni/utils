[workspace]
resolver = "2"
members = [
    "apps/packages/ui-kit",
    "apps/packages/domain-types",
    "apps/packages/client-core",
    "services/auth-service",
    "services/driver-service",
    "services/admin-service"
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/mezni/BorneMap"
authors = ["BorneMap Team"]

[workspace.dependencies]
# Core serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Web framework
actix-web = "4.4"
actix-cors = "0.6"

# Database
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio", "chrono"] }

# Validation
validator = { version = "0.16", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Configuration
config = "0.14"
clap = { version = "4.4", features = ["derive"] }

# Database migrations
migration-engine = { version = "0.4", features = ["sqlx"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
