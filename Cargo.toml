[workspace]
resolver = "2"
members = [
    "shared-database",
    "shared-cache",
    "shared-jwt",
    "shared-errors",
    "shared-contracts",
    "auth-service",
]
exclude = []

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["BorneMap Team"]
repository = "https://github.com/bornemap/auth-service"
license = "MIT"
homepage = "https://borne-map.example.com"

[workspace.dependencies]
tokio = { version = "1.35", features = ["full"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }
redis = { version = "0.24", features = ["tokio-comp"] }
jsonwebtoken = { version = "9", features = ["use_p256"] }
rand = "0.8"
argon2 = "0.5"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"
dotenvy = "0.15"
const-str = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"