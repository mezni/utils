[workspace]
members = [
    "services/admin-service",
    "crates/platform-core",
    "crates/platform-db"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["BorneMap Team"]
license = "MIT"

[workspace.dependencies]
# Runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

# Database
sqlx = { version = "0.7", features = ["postgres", "chrono", "runtime-tokio-rustls"] }

# Web
actix-web = "4.4"
actix-cors = "0.6"

# Validation
validator = { version = "0.16", features = ["derive"] }

# ID Generation
nanoid = "0.4"

# Error Handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Configuration
config = "0.14"
dotenv = "0.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
