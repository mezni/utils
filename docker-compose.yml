services:
  postgres:
    image: postgres:16-alpine
    container_name: bornemap-postgres
    environment:
      POSTGRES_USER: bornemap
      POSTGRES_PASSWORD: bornemap
      POSTGRES_DB: bornemap
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/platform_db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bornemap"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bornemap-network

  driver-service:
    build:
      context: ./source/services/driver-service
      dockerfile: Dockerfile
    container_name: bornemap-driver-service
    environment:
      DATABASE_URL: postgresql://bornemap:bornemap@postgres:5432/bornemap
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bornemap-network
    restart: unless-stopped

  web-driver:
    build:
      context: ./source
      dockerfile: apps/web-driver/Dockerfile
    container_name: bornemap-web-driver
    environment:
      VITE_API_BASE_URL: http://localhost:3001
    ports:
      - "5173:5173"
    depends_on:
      - driver-service
    restart: unless-stopped
    networks:
      - bornemap-network

  osm-importer:
    build:
      context: ./infra/docker/osm-importer
      dockerfile: Dockerfile
    container_name: bornemap-osm-importer
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: bornemap
      DB_PASSWORD: bornemap
      DB_NAME: bornemap
      SOURCE_URL: https://download.geofabrik.de/africa/tunisia-latest.osm.pbf
    volumes:
      - osm_data:/app/data
      - ./migrations/platform_db/gis:/app/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bornemap-network
    command: sh -c "sleep 5 && pnpm run import"

volumes:
  postgres_data:
  osm_data:

networks:
  bornemap-network:
    driver: bridge
