services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: bornemap-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-bornemap}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bornemap_dev}
      POSTGRES_DB: ${DB_NAME:-bornemap}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bornemap} -d ${DB_NAME:-bornemap}"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: bornemap-auth
    restart: unless-stopped
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  admin-service:
    build:
      context: .
      dockerfile: services/admin-service/Dockerfile
    container_name: bornemap-admin
    restart: unless-stopped
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: 3002
      DB_HOST: postgres
      DB_PORT: 5432
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy

  driver-service:
    build:
      context: .
      dockerfile: services/driver-service/Dockerfile
    container_name: bornemap-driver
    restart: unless-stopped
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: 3003
      DB_HOST: postgres
      DB_PORT: 5432
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
