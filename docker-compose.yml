version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bornemap}
      POSTGRES_USER: ${POSTGRES_USER:-bornemap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bornemap_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bornemap}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: ${POSTGRES_DB:-bornemap}
      KC_DB_USERNAME: ${POSTGRES_USER:-bornemap}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-bornemap_dev}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  auth-service:
    image: ${AUTH_SERVICE_IMAGE:-ghcr.io/mezni/bornemap/auth-service:latest}
    build:
      context: services/auth-service
      dockerfile: Dockerfile
    ports:
      - "${AUTH_SERVICE_PORT:-3000}:3000"
    environment:
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://keycloak:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-bornemap}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    depends_on:
      keycloak:
        condition: service_healthy

  core-service:
    image: ${CORE_SERVICE_IMAGE:-ghcr.io/mezni/bornemap/core-service:latest}
    build:
      context: services/core-service
      dockerfile: Dockerfile
    ports:
      - "${CORE_SERVICE_PORT:-3001}:3001"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-bornemap}
      POSTGRES_USER: ${POSTGRES_USER:-bornemap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bornemap_dev}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  geo-service:
    image: ${GEO_SERVICE_IMAGE:-ghcr.io/mezni/bornemap/geo-service:latest}
    build:
      context: services/geo-service
      dockerfile: Dockerfile
    ports:
      - "${GEO_SERVICE_PORT:-3002}:3002"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-bornemap}
      POSTGRES_USER: ${POSTGRES_USER:-bornemap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bornemap_dev}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    depends_on:
      postgres:
        condition: service_healthy

  analytics-service:
    image: ${ANALYTICS_SERVICE_IMAGE:-ghcr.io/mezni/bornemap/analytics-service:latest}
    build:
      context: services/analytics-service
      dockerfile: Dockerfile
    ports:
      - "${ANALYTICS_SERVICE_PORT:-3003}:3003"
    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DB: ${MONGO_DB:-bornemap}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - auth-service
      - core-service
      - geo-service
      - analytics-service

volumes:
  postgres_data:
  mongo_data:
  rabbitmq_data:
