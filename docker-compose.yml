services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: bornemap-postgres
    environment:
      POSTGRES_USER: bornemap
      POSTGRES_PASSWORD: bornemap
      POSTGRES_DB: bornemap
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/platform_db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bornemap"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bornemap-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: bornemap-keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: bornemap
      KC_DB_PASSWORD: bornemap
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
      - "9000:9000"
    volumes:
      - ./infra/keycloak/realm:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bornemap-network
    restart: unless-stopped

  driver-service:
    build:
      context: ./source/services/driver-service
      dockerfile: Dockerfile
    container_name: bornemap-driver-service
    environment:
      DATABASE_URL: postgresql://bornemap:bornemap@postgres:5432/bornemap
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bornemap-network
    restart: unless-stopped

  web-driver:
    build:
      context: ./source
      dockerfile: apps/web-driver/Dockerfile
    container_name: bornemap-web-driver
    environment:
      VITE_API_BASE_URL: http://localhost:3001
    ports:
      - "5173:5173"
    depends_on:
      - driver-service
    restart: unless-stopped
    networks:
      - bornemap-network

  admin-service:
    build:
      context: ./source/services/admin-service
      dockerfile: Dockerfile
    container_name: bornemap-admin-service
    environment:
      DATABASE_URL: postgresql://bornemap:bornemap@postgres:5432/bornemap
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bornemap-network
    restart: unless-stopped

  auth-service:
    build:
      context: ./source/services/auth-service
      dockerfile: Dockerfile
    container_name: bornemap-auth-service
    environment:
      SERVICE_PORT: "3000"
      DATABASE_URL: postgresql://bornemap:bornemap@postgres:5432/bornemap
      KEYCLOAK_REALM: bornemap
      KEYCLOAK_ISSUER: http://keycloak:8080/realms/bornemap
      KEYCLOAK_CLIENT_ID: admin-dashboard
      KEYCLOAK_CLIENT_SECRET: pXFERGbIuDhSDGBL555DVlt1hRgIzt93
      KEYCLOAK_REDIRECT_URI: http://localhost:5174/auth/callback
      RUST_LOG: info
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - bornemap-network
    restart: unless-stopped

  osm-importer:
    build:
      context: ./infra/docker/osm-importer
      dockerfile: Dockerfile
    container_name: bornemap-osm-importer
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: bornemap
      DB_PASSWORD: bornemap
      DB_NAME: bornemap
      SOURCE_URL: https://download.geofabrik.de/africa/tunisia-latest.osm.pbf
    volumes:
      - osm_data:/app/data
      - ./migrations/platform_db/gis:/app/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bornemap-network
    command: sh -c "sleep 5 && python3 scripts/parse_and_import.py --pbf /data/tunisia.osm.pbf --db-host postgres --db-port 5432 --db-name bornemap --db-user bornemap --db-password bornemap"

volumes:
  postgres_data:
  osm_data:

networks:
  bornemap-network:
    driver: bridge
