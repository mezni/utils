version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: bornemap-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bornemap_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bornemap_password}
      POSTGRES_DB: ${POSTGRES_DB:-ev_platform}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bornemap_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  bornemap-service:
    build:
      context: ./source/services/bornemap-service
      dockerfile: Dockerfile
    container_name: bornemap-service
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bornemap_user}:${POSTGRES_PASSWORD:-bornemap_password}@postgres:5432/${POSTGRES_DB:-ev_platform}
      API_PORT: ${API_PORT:-8000}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./source/services/bornemap-service/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
