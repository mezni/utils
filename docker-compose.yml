services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bornemap}
      POSTGRES_USER: ${POSTGRES_USER:-bornemap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bornemap_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bornemap}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: ${POSTGRES_DB:-bornemap}
      KC_DB_USERNAME: ${POSTGRES_USER:-bornemap}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-bornemap_dev}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  # Core Service
  core-service:
    build:
      context: ./services/core-service
      dockerfile: Dockerfile
    image: bornemap/core-service:latest
    ports:
      - "8081:8080"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-bornemap}:${POSTGRES_PASSWORD:-bornemap_dev}@postgres:5432/${POSTGRES_DB:-bornemap}
      - RUST_LOG=info
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-here}
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/core-service"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    # depends_on stubs removed — uncomment when services are created in Phase 2+

volumes:
  postgres_data:
  mongo_data:
  rabbitmq_data:
