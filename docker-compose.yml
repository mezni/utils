version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: bornemap_db_dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_password_change_me
      POSTGRES_DB: bornemap_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - bornemap_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bornemap_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

networks:
  bornemap_network:
    driver: bridge
