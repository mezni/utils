services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: borne-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: borne_map
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 5
      start_period: 30s
    networks:
      - borne-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: borne-keycloak
    ports:
      - "8180:8180"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/borne_map
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KC_HOSTNAME: localhost
      KC_HTTP_PORT: 8180
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    command: start-dev --import-realm
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost:8180 && echo -e \"GET /realms/ev-platform HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n\" >&3 && head -1 <&3 | grep -q 200' || exit 1"]
      interval: 15s
      retries: 6
      start_period: 120s
    networks:
      - borne-network

  driver-service:
    build:
      context: .
      dockerfile: source/services/driver-service/Dockerfile
    container_name: borne-driver-service
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/borne_map
      PORT: "8080"
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/health || exit 1"]
      interval: 15s
      retries: 3
      start_period: 30s
    networks:
      - borne-network

  admin-service:
    build:
      context: .
      dockerfile: source/services/admin-service/Dockerfile
    container_name: borne-admin-service
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/borne_map
      PORT: "8081"
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/api/health || exit 1"]
      interval: 15s
      retries: 3
      start_period: 30s
    networks:
      - borne-network

  dashboard:
    build:
      context: .
      dockerfile: source/apps/dashboard/Dockerfile
    container_name: borne-dashboard
    ports:
      - "5173:5173"
    environment:
      API_BASE_URL: http://admin-service:8081
    depends_on:
      admin-service:
        condition: service_started
    networks:
      - borne-network

  driver-web:
    build:
      context: .
      dockerfile: source/apps/driver-web/Dockerfile
    container_name: borne-driver-web
    ports:
      - "5174:5174"
    environment:
      API_BASE_URL: http://driver-service:8080
    depends_on:
      driver-service:
        condition: service_started
    networks:
      - borne-network

  driver-mobile:
    build:
      context: .
      dockerfile: source/apps/driver-mobile/Dockerfile
    container_name: borne-driver-mobile
    ports:
      - "8082:8081"
    environment:
      API_BASE_URL: http://driver-service:8080
    depends_on:
      driver-service:
        condition: service_started
    networks:
      - borne-network

networks:
  borne-network:
    driver: bridge

volumes:
  pgdata:
