# OpenAPI Contract: FastAPI Foundation
#
# Feature: 002-fastapi-foundation   Date: 2026-09-26
#
# The description the server is expected to generate, so it can be diffed against the
# live /openapi.json during validation (see quickstart.md).
#
# info.title comes from APP_NAME; info.version comes from APP_VERSION and is NOT a
# literal here (FR-005, SC-011). The installed package version must equal it.
#
# Served URLs and their switches:
#   /openapi.json  <- API_DOCS_ENABLED   (404 when false)
#   /docs          <- API_DOCS_ENABLED   (404 when false)
#   /redoc         <- API_REDOC_ENABLED  (404 when false)
#   /health        <- never switched     (always served)
# The two switches are independent: disabling one leaves the other description and
# /health working (FR-004). Neither is a security control.
#
# Deliberately absent, and why:
#   - No /api/v1 path entry. The versioned namespace is reserved and configurable but
#     holds no routes, so the description truthfully lists none. The specification
#     clarification dropped the requirement that the empty namespace appear here; a
#     placeholder route would have published a fictional endpoint. The namespace
#     appears as soon as the first route is mounted inside it.
#   - No securitySchemes. Authentication is Phase 12 (FR-018).
#   - No /api/v1/health. That path was explicitly rejected; docs/API.md 25.2 records it.
#   - Only three error codes. The published list has seventeen; this feature can emit
#     three. None of the others is invented here.
#
# Every failure returns ErrorEnvelope, including a 500 from an unanticipated exception,
# whose body carries a fixed message and never the exception text, a stack frame, or a
# file system path (FR-009).

openapi: 3.1.0

info:
  title: Fake E-Commerce Server
  version: "0.1.0"
  description: Phase 1 foundation. Liveness only; no business endpoints yet.

paths:
  /health:
    get:
      summary: Liveness check
      description: >-
        Reports that the process is operational. Unversioned, unauthenticated, and
        independent of every subsystem: no database, cache, migration state, or
        external provider is consulted.
      operationId: health_check
      tags: [operational]
      responses:
        "200":
          description: The process is operational
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              example:
                status: ok
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          const: ok
          description: >-
            Always "ok". Deliberately carries no version, timestamp, uptime, or
            dependency status (FR-002, FR-003).

    ErrorEnvelope:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, details, request_id]
          additionalProperties: false
          properties:
            code:
              type: string
              description: >-
                Stable machine-readable code, drawn from the published list. This
                feature can emit only NOT_FOUND, VALIDATION_ERROR, INTERNAL_ERROR.
              enum: [NOT_FOUND, VALIDATION_ERROR, INTERNAL_ERROR]
            message:
              type: string
              description: >-
                Human-readable summary. For a 500 this is a fixed generic message and
                never the exception text.
            details:
              type: array
              description: >-
                Field-level issues. Always an array, empty when there are none, and
                never an object (FR-008).
              items: {}
            request_id:
              type: string
              description: >-
                Identifier a client can quote in a bug report. Echoes an acceptable
                inbound X-Request-ID, otherwise a generated UUID4.

  responses:
    NotFound:
      description: The path is not a known route
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: NOT_FOUND
              message: Resource not found
              details: []
              request_id: 7d3f4a2e-1c4b-4a90-9f31-2b8e6d5a0c11

    InternalError:
      description: >-
        An unanticipated server fault. The cause is logged server-side and never
        included in the response (FR-009).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: INTERNAL_ERROR
              message: Internal server error
              details: []
              request_id: 7d3f4a2e-1c4b-4a90-9f31-2b8e6d5a0c11
