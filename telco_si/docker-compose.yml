services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: telco
      POSTGRES_PASSWORD: telco
      POSTGRES_DB: telco
    ports:
      - "5432:5432"
    volumes:
      - telco-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telco -d telco"]
      interval: 2s
      timeout: 2s
      retries: 60

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://telco:telco@db:5432/telco
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      DB_RETRY_WINDOW: "30"
    ports:
      - "8000:8000"
    volumes:
      - ./tests:/app/tests
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  telco-pgdata: