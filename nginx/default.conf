server {
    listen 80;
    server_name localhost;

    # Auth service
    location /auth/ {
        rewrite ^/auth/(.*) /$1 break;
        proxy_pass http://auth-service:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Core service
    location /api/core/ {
        rewrite ^/api/core/(.*) /$1 break;
        proxy_pass http://core-service:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Geo service
    location /api/geo/ {
        rewrite ^/api/geo/(.*) /$1 break;
        proxy_pass http://geo-service:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Analytics service
    location /api/analytics/ {
        rewrite ^/api/analytics/(.*) /$1 break;
        proxy_pass http://analytics-service:3003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Health endpoints
    location /health/auth-service {
        proxy_pass http://auth-service:3000/health;
        proxy_set_header Host $host;
    }

    location /health/core-service {
        proxy_pass http://core-service:3001/health;
        proxy_set_header Host $host;
    }

    location /health/geo-service {
        proxy_pass http://geo-service:3002/health;
        proxy_set_header Host $host;
    }

    location /health/analytics-service {
        proxy_pass http://analytics-service:3003/health;
        proxy_set_header Host $host;
    }

    # Metrics endpoints
    location /metrics/auth-service {
        proxy_pass http://auth-service:3000/metrics;
        proxy_set_header Host $host;
    }

    location /metrics/core-service {
        proxy_pass http://core-service:3001/metrics;
        proxy_set_header Host $host;
    }

    location /metrics/geo-service {
        proxy_pass http://geo-service:3002/metrics;
        proxy_set_header Host $host;
    }

    location /metrics/analytics-service {
        proxy_pass http://analytics-service:3003/metrics;
        proxy_set_header Host $host;
    }

    # Default — 404 for unknown paths
    location / {
        return 404;
    }
}
