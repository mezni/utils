[workspace]
resolver = "2"
members = [
    "crates/ev-core",
    "crates/ev-db",
    "services/driver-service",
    "services/admin-service",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "macros", "chrono", "migrate"] }
