[package]
name = "ev-db"
version = "0.1.0"
edition = "2021"
description = "PostgreSQL database connectivity and migration runner"

[dependencies]
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "migrate"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
thiserror = "1"
ev-core = { path = "../ev-core" }

[lints]
workspace = true
