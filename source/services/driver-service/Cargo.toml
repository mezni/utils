[package]
name = "driver-service"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "driver-service"
path = "src/main.rs"

[dependencies]
actix-web = "4.9"
actix-rt = "2.10"
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = ["postgres", "json", "chrono", "runtime-tokio-native-tls", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-actix-web = "0.7"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
anyhow = "1.0"
thiserror = "1.0"
futures = "0.3"

db-core = { path = "../libs/db-core" }
geo-core = { path = "../libs/geo-core" }
services-shared = { path = "../shared" }
