[package]
name = "driver-service"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-rt = "2"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-actix-web = "0.7"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
borne-data = { path = "../libs/borne-data" }

[dev-dependencies]
testcontainers = "0.23"

[lints]
workspace = true
