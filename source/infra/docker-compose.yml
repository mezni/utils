name: bornemap

services:

  postgres:
    image: postgis/postgis:16-3.4
    container_name: bornemap-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?POSTGRES_PASSWORD required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bornemap-net

  redis:
    image: redis:7-alpine
    container_name: bornemap-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bornemap-net

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: bornemap-keycloak
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN?KEYCLOAK_ADMIN required}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD?KEYCLOAK_ADMIN_PASSWORD required}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD?KEYCLOAK_DB_PASSWORD required}
      KC_HOSTNAME: localhost
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm-export:/opt/keycloak/data/import
    depends_on:
      postgres:
        condition: service_healthy
    command: ["start-dev", "--import-realm"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && exec 3<&-"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s
    networks:
      - bornemap-net

  traefik:
    image: traefik:v3.1
    container_name: bornemap-traefik
    ports:
      - "80:80"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      disable: true
    networks:
      - bornemap-net

  auth-service:
    build:
      context: ./stubs/auth-service
    container_name: bornemap-auth-stub
    expose:
      - "3000"
    networks:
      - bornemap-net

  admin-service:
    build:
      context: ./stubs/admin-service
    container_name: bornemap-admin-stub
    expose:
      - "3002"
    networks:
      - bornemap-net

  driver-service:
    build:
      context: ./stubs/driver-service
    container_name: bornemap-driver-stub
    expose:
      - "3001"
    networks:
      - bornemap-net

  catch-all:
    build:
      context: ./stubs/catch-all
    container_name: bornemap-catch-all
    expose:
      - "3099"
    networks:
      - bornemap-net

volumes:
  pgdata:
  keycloak_data:
  redis_data:

networks:
  bornemap-net:
    driver: bridge
