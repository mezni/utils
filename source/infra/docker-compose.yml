version: '3.8'

services:
  # ============================================================================
  # 🚦 EDGE NETWORKING: TRAEFIK REVERSE PROXY & INGRESS ROUTER
  # ============================================================================
  traefik:
    image: traefik:v3.0
    container_name: bornemap-gateway
    restart: always
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--accesslog=true"
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik:/etc/traefik/dynamic:ro
    networks:
      - platform-mesh
    logging:
      driver: "json-file"
      options:
        max-size: "10m"

  # ============================================================================
  # 🗄️ REPOSITORY TIER: POSTGIS GEOSPATIAL CLUSTER
  # ============================================================================
  database:
    image: postgis/postgis:16-3.4
    container_name: bornemap-postgres
    restart: always
    environment:
      POSTGRES_USER: platform_admin
      POSTGRES_PASSWORD: platform_secure_password_2026
      POSTGRES_DB: platform_db
    ports:
      - "5432:5432"
    volumes:
      - bornemap-postgres-data:/var/lib/postgresql/data
      - ../database/platform_db/platform-init.sql:/docker-entrypoint-initdb.d/01-platform-init.sql
      - ../database/platform_db/functions.sql:/docker-entrypoint-initdb.d/02-functions.sql
    networks:
      - platform-mesh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_admin -d platform_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # ⚙️ LOGIC TIER: CLEAN ARCHITECTURE CORE MICROSERVICES
  # ============================================================================
  auth-service:
    build:
      context: ../../
      dockerfile: source/services/auth-service/Dockerfile
    container_name: bornemap-auth-node
    restart: always
    environment:
      DATABASE_URL: "postgres://platform_admin:platform_secure_password_2026@database:5432/platform_db"
      AUTH_JWT_SECRET: "dev-secret-key-change-in-production"
      RUST_LOG: "info,auth_service=debug"
    expose:
      - "3000"
    depends_on:
      database:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth-router.rule=PathPrefix(`/api/v1/auth`)"
      - "traefik.http.routers.auth-router.entrypoints=web"
      - "traefik.http.services.auth-service.loadbalancer.server.port=3000"
    networks:
      - platform-mesh

  driver-service:
    build:
      context: ../../
      dockerfile: source/services/driver-service/Dockerfile
    container_name: bornemap-driver-node
    restart: always
    environment:
      DATABASE_URL: "postgres://platform_admin:platform_secure_password_2026@database:5432/platform_db"
      RUST_LOG: "info,driver_service=debug"
    expose:
      - "3001"
    depends_on:
      database:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.driver-router.rule=PathPrefix(`/api/v1/driver`)"
      - "traefik.http.routers.driver-router.entrypoints=web"
      - "traefik.http.services.driver-service.loadbalancer.server.port=3001"
    networks:
      - platform-mesh

  admin-service:
    build:
      context: ../../
      dockerfile: source/services/admin-service/Dockerfile
    container_name: bornemap-admin-node
    restart: always
    environment:
      DATABASE_URL: "postgres://platform_admin:platform_secure_password_2026@database:5432/platform_db"
      RUST_LOG: "info,admin_service=debug"
    expose:
      - "3002"
    depends_on:
      database:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin-router.rule=PathPrefix(`/api/v1/admin`)"
      - "traefik.http.routers.admin-router.entrypoints=web"
      - "traefik.http.services.admin-service.loadbalancer.server.port=3002"
    networks:
      - platform-mesh

# ============================================================================
# 🌐 NETWORK SEGREGATION & VOLUMES STORAGE
# ============================================================================
networks:
  platform-mesh:
    driver: bridge
    name: bornemap-platform-mesh

volumes:
  bornemap-postgres-data:
    driver: local
