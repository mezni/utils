networks:
  bornemap:
    driver: bridge

volumes:
  platform_db_data:
    name: bornemap_platform_db_data
  analytics_db_data:
    name: bornemap_analytics_db_data
  cargo-registry:
  cargo-git:

services:
  platform-db:
    image: postgis/postgis:16-3.4
    container_name: bornemap-platform-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: platform_db
      POSTGRES_USER: borneadmin
      POSTGRES_PASSWORD: ${PLATFORM_DB_PASSWORD:-borne_dev_2026}
    volumes:
      - platform_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U borneadmin -d platform_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - bornemap
    restart: unless-stopped

  analytics-db:
    image: postgres:16
    container_name: bornemap-analytics-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: analytics_db
      POSTGRES_USER: borneadmin
      POSTGRES_PASSWORD: ${ANALYTICS_DB_PASSWORD:-borne_dev_2026}
    volumes:
      - analytics_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U borneadmin -d analytics_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - bornemap
    restart: unless-stopped

  driver-service:
    build:
      context: ..
      dockerfile: infra/docker/driver-service.Dockerfile
      args:
        SERVICE_NAME: driver-service
        APP_PORT: 8080
    container_name: bornemap-driver
    ports:
      - "8080:8080"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      PLATFORM_DB_URL: postgresql://borneadmin:${PLATFORM_DB_PASSWORD:-borne_dev_2026}@platform-db:5432/platform_db
      PORT: 8080
    depends_on:
      platform-db:
        condition: service_healthy
    volumes:
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
    networks:
      - bornemap
    restart: unless-stopped

  traefik:
    image: traefik:v2.10
    container_name: bornemap-traefik
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "8082:8080"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      driver-service:
        condition: service_started
      admin-service:
        condition: service_started
    networks:
      - bornemap
    restart: unless-stopped

  admin-service:
    build:
      context: ..
      dockerfile: infra/docker/admin-service.Dockerfile
      args:
        SERVICE_NAME: admin-service
        APP_PORT: 8081
    container_name: bornemap-admin
    ports:
      - "8081:8081"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      PLATFORM_DB_URL: postgresql://borneadmin:${PLATFORM_DB_PASSWORD:-borne_dev_2026}@platform-db:5432/platform_db
      ANALYTICS_DB_URL: postgresql://borneadmin:${ANALYTICS_DB_PASSWORD:-borne_dev_2026}@analytics-db:5432/analytics_db
      PORT: 8081
    depends_on:
      platform-db:
        condition: service_healthy
      analytics-db:
        condition: service_healthy
    volumes:
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
    networks:
      - bornemap
    restart: unless-stopped
