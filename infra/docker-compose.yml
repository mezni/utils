
services:
  platform-db:
    image: postgis/postgis:16-3.4
    container_name: bornemap-platform-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: platform_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - platform-db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d platform_db || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - borne-net
    restart: unless-stopped

  analytics-db:
    image: postgres:16
    container_name: bornemap-analytics-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: analytics_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - analytics-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d analytics_db || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - borne-net
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: bornemap-keycloak
    ports:
      - "8083:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://platform-db:5432/platform_db
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET / HTTP/1.0\\r\\nHost: localhost:8080\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    command: start-dev
    networks:
      - borne-net
    restart: unless-stopped

networks:
  borne-net:
    driver: bridge

volumes:
  platform-db-data:
  analytics-db-data:
