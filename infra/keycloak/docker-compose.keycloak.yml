services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: bornemap-postgres
    environment:
      POSTGRES_USER: bornemap
      POSTGRES_PASSWORD: bornemap
      POSTGRES_DB: bornemap
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../migrations/platform_db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bornemap"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bornemap-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: bornemap-keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: bornemap
      KC_DB_PASSWORD: bornemap
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./realm:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bornemap-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  bornemap-network:
    driver: bridge
