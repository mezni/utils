http:
  routers:
    driver:
      rule: "Host(`driver.example.tn`)"
      service: driver-service
      entryPoints:
        - web
        - websecure

    admin:
      rule: "Host(`admin.example.tn`)"
      service: admin-service
      entryPoints:
        - web
        - websecure

    api:
      rule: "Host(`api.example.tn`)"
      service: backend
      entryPoints:
        - web
        - websecure

    auth:
      rule: "Host(`auth.example.tn`)"
      service: keycloak
      entryPoints:
        - web
        - websecure

    partner:
      rule: "Host(`partner.example.tn`)"
      service: partner-dashboard
      entryPoints:
        - web
        - websecure

  services:
    driver-service:
      loadBalancer:
        servers:
          - url: "http://driver-service.internal:8081"

    admin-service:
      loadBalancer:
        servers:
          - url: "http://admin-service.internal:8082"

    backend:
      loadBalancer:
        servers:
          - url: "http://clickstream-service.internal:8083"

    keycloak:
      loadBalancer:
        servers:
          - url: "http://keycloak.internal:8080"

    partner-dashboard:
      loadBalancer:
        servers:
          - url: "http://partner-dashboard.internal:5173"
