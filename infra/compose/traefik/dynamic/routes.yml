# Partner-dashboard runs outside Docker (Vite dev server or static build).
# The service entry below resolves when the frontend is deployed alongside.
http:
  routers:
    driver:
      rule: "Host(`driver.example.tn`)"
      service: driver-service
      entryPoints:
        - web
        - websecure

    admin:
      rule: "Host(`admin.example.tn`)"
      service: admin-service
      entryPoints:
        - web
        - websecure

    api:
      rule: "Host(`api.example.tn`)"
      service: backend
      entryPoints:
        - web
        - websecure

    auth:
      rule: "Host(`auth.example.tn`)"
      service: keycloak
      entryPoints:
        - web
        - websecure

    partner:
      rule: "Host(`partner.example.tn`)"
      service: partner-dashboard
      entryPoints:
        - web
        - websecure

  services:
    driver-service:
      loadBalancer:
        servers:
          - url: "http://driver-service.internal:8081"

    admin-service:
      loadBalancer:
        servers:
          - url: "http://admin-service.internal:8082"

    backend:
      loadBalancer:
        servers:
          - url: "http://clickstream-service.internal:8083"

    keycloak:
      loadBalancer:
        servers:
          - url: "http://keycloak.internal:8080"

    # Partner-dashboard frontend; not defined in docker-compose.yml.
    # Must be reachable on the Docker network (e.g. via HOST:PORT) when running.
    partner-dashboard:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:5173"
