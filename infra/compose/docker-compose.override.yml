# Docker Compose override for local development.
# Exposes infrastructure ports on localhost for tooling access.
# Used automatically by `docker compose up` when this file is present alongside docker-compose.yml.
services:
  postgres:
    ports:
      - "5432:5432"
    networks:
      public: {}

  rabbitmq:
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      public: {}

  keycloak:
    ports:
      - "8080:8080"
    networks:
      public: {}
