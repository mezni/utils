# Git Extension Configuration for SpecKit
# Auto-commit hooks for SpecKit workflow

hooks:
  before_implement:
    - command: speckit.git.commit
      description: "Auto-commit before implementation"
      condition: null
      enabled: true
      optional: true

  after_implement:
    - command: speckit.git.commit
      description: "Auto-commit after implementation"
      condition: null
      enabled: true
      optional: true

  before_checklist:
    - command: speckit.git.commit
      description: "Auto-commit before checklist generation"
      condition: null
      enabled: true
      optional: true

  before_analyze:
    - command: speckit.git.commit
      description: "Auto-commit before analysis"
      condition: null
      enabled: true
      optional: true

  before_taskstoissues:
    - command: speckit.git.commit
      description: "Auto-commit before task-to-issue sync"
      condition: null
      enabled: true
      optional: true

settings:
  commit_before_actions: true
  commit_message_pattern: "fix({scope}): {description}"
  stash_untracked: true
  push_after_commit: false
