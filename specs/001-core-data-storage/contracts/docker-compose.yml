# Contract: Docker Compose Infrastructure
#
# Sprint 1.1 deploys:
#   platform_db  — PostgreSQL 16 + PostGIS 3.4
#
# Version: 1.0.0
# Status: DRAFT

version: "3.9"

services:
  platform_db:
    image: postgis/postgis:16-3.4
    container_name: bornemap-db
    environment:
      POSTGRES_DB: platform_db
      POSTGRES_USER: bornemap
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bornemap -d platform_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  pgdata:
