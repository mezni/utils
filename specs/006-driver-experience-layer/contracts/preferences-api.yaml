openapi: 3.1.0
info:
  title: Preferences API
  version: 1.0.0
  description: |
    User preferences API. Preferences stored in users.preferences JSONB
    under the `preferences` key. Owned by auth-service.

servers:
  - url: http://localhost:3000/api/v1/auth
    description: auth-service development

paths:
  /preferences:
    get:
      summary: Get user preferences
      operationId: getPreferences
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferencesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    put:
      summary: Update user preferences (full replace)
      operationId: updatePreferences
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePreferencesRequest'
      responses:
        '200':
          description: Preferences updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferencesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    patch:
      summary: Update specific preference fields (partial update)
      operationId: patchPreferences
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePreferencesRequest'
      responses:
        '200':
          description: Preferences updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferencesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Preferences:
      type: object
      properties:
        connector_type:
          type: string
          enum: [CCS, CHAdeMO, Type2]
          nullable: true
          description: Preferred charger type
        max_distance:
          type: integer
          minimum: 1
          maximum: 500
          description: Max search radius in km
        last_region:
          type: object
          properties:
            lat:
              type: number
              format: float
              minimum: -90
              maximum: 90
            lng:
              type: number
              format: float
              minimum: -180
              maximum: 180
        map_filters:
          type: object
          properties:
            available_only:
              type: boolean

    PreferencesResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Preferences'

    UpdatePreferencesRequest:
      type: object
      properties:
        connector_type:
          type: string
          enum: [CCS, CHAdeMO, Type2]
          nullable: true
        max_distance:
          type: integer
          minimum: 1
          maximum: 500
        last_region:
          type: object
          properties:
            lat:
              type: number
              format: float
            lng:
              type: number
              format: float
        map_filters:
          type: object
          properties:
            available_only:
              type: boolean

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        message:
          type: string

  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
