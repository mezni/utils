## Monitoring

**Metrics**:
- `cache_invalidation_requests_total` (counter)
- `cache_invalidation_duration_seconds` (histogram)
- `cache_invalidation_errors_total` (counter)
- `circuit_breaker_state` (gauge: Closed/Open/HalfOpen)
- `circuit_breaker_opened_total` (counter)

**Alerts**:
- Circuit breaker open > 5 minutes
- Cache invalidation errors > 10% failure rate
- Cache invalidation duration > 5 seconds

