## Cache Invalidation Middleware (Admin-Service)

**Location**: `admin-service/src/services/cache_invalidation.rs`

**Schema**:
```rust
use serde::{Deserialize, Serialize};
use chrono::{DateTime, Utc};
use std::time::Duration;

#[derive(Debug, Clone, Serialize, Deserialize)]
pub struct CacheInvalidationRequest {
    pub station_id: Option<String>,
    pub user_uuid: Option<String>,
    pub event_type: EventType,
    pub timestamp: DateTime<Utc>,
}

#[derive(Debug, Clone, Serialize, Deserialize, PartialEq)]
pub enum EventType {
    VIEW,
    FAVORITE,
    SEARCH,
    LOGIN,
    LOGOUT,
}

#[derive(Debug, Clone, Serialize, Deserialize)]
pub struct CacheInvalidationResponse {
    pub success: bool,
    pub invalidated_at: DateTime<Utc>,
    pub cached_keys: Vec<String>,
    pub views_refreshed: u64,
    pub duration_ms: u64,
}

pub struct CacheInvalidationService;

impl CacheInvalidationService {
    pub async fn invalidate(
        &self,
        request: CacheInvalidationRequest,
    ) -> Result<CacheInvalidationResponse, CacheInvalidationError> {
        let start = Instant::now();

        // Validate event type
        self.validate_event_type(&request.event_type)?;

        // Refresh materialized views based on event type
        let views_refreshed = match request.event_type {
            EventType::VIEW | EventType::FAVORITE => {
                self.refresh_station_views(request.station_id.as_ref()).await?
            }
            EventType::SEARCH => {
                self.refresh_search_trends().await?
            }
            EventType::LOGIN | EventType::LOGOUT => {
                self.refresh_user_activity(request.user_uuid.as_ref()).await?
            }
        };

        // Invalidate cache entries
        let cached_keys = self.invalidate_cache_entries(request).await?;

        let duration = start.elapsed().as_millis() as u64;

        Ok(CacheInvalidationResponse {
            success: true,
            invalidated_at: Utc::now(),
            cached_keys,
            views_refreshed,
            duration_ms: duration,
        })
    }

    async fn refresh_station_views(&self, station_id: Option<&String>) -> Result<u64, CacheInvalidationError> {
        if let Some(id) = station_id {
            // Refresh station-specific data
            db::queries::materialized_views::refresh_station_view(id).await?;
            Ok(1)
        } else {
            // Refresh all stations (expensive, avoid in production)
            Ok(0)  // Skip full refresh
        }
    }

    async fn refresh_search_trends(&self) -> Result<u64, CacheInvalidationError> {
        // Refresh search trends
        db::queries::materialized_views::refresh_search_trends().await?;
        Ok(1)
    }

    async fn refresh_user_activity(&self, user_uuid: Option<&String>) -> Result<u64, CacheInvalidationError> {
        if let Some(uuid) = user_uuid {
            // Refresh user-specific data
            db::queries::materialized_views::refresh_user_view(uuid).await?;
            Ok(1)
        } else {
            // Refresh all users (expensive, avoid in production)
            Ok(0)  // Skip full refresh
        }
    }

    async fn invalidate_cache_entries(
        &self,
        request: CacheInvalidationRequest,
    ) -> Result<Vec<String>, CacheInvalidationError> {
        let mut keys = Vec::new();

        // Invalidate station analytics
        if let Some(station_id) = request.station_id {
            cache_service.delete(format!("station_{}", station_id)).await?;
            keys.push(format!("station_{}", station_id));
        }

        // Invalidate user activity
        if let Some(user_uuid) = request.user_uuid {
            cache_service.delete(format!("user_{}", user_uuid)).await?;
            keys.push(format!("user_{}", user_uuid));
        }

        // Invalidate search trends
        if request.event_type == EventType::SEARCH {
            cache_service.delete("search_trends").await?;
            keys.push("search_trends".to_string());
        }

        // Invalidate summary cache
        cache_service.delete("summary").await?;
        keys.push("summary".to_string());

        Ok(keys)
    }

    fn validate_event_type(&self, event_type: &EventType) -> Result<(), CacheInvalidationError> {
        match event_type {
            EventType::VIEW | EventType::FAVORITE | EventType::SEARCH | EventType::LOGIN | EventType::LOGOUT => {
                Ok(())
            }
            _ => Err(CacheInvalidationError::InvalidEventType {
                invalid_type: format!("{:?}", event_type),
                valid_types: vec![
                    "VIEW".to_string(),
                    "FAVORITE".to_string(),
                    "SEARCH".to_string(),
                    "LOGIN".to_string(),
                    "LOGOUT".to_string(),
                ],
            }),
        }
    }
}

#[derive(Debug, thiserror::Error)]
pub enum CacheInvalidationError {
    #[error("Invalid event type: {0}")]
    InvalidEventType {
        invalid_type: String,
        valid_types: Vec<String>,
    },
    #[error("Database error: {0}")]
    Database(#[from] sqlx::Error),
    #[error("Cache error: {0}")]
    Cache(#[from] redis::RedisError),
    #[error("Invalid station ID: {0}")]
    InvalidStationId(String),
    #[error("Invalid user UUID: {0}")]
    InvalidUserUuid(String),
}
```

