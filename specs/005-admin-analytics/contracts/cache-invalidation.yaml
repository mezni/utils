## Materialized View Refresh Logic

### Station Analytics Refresh

**Trigger**: VIEW or FAVORITE event

**Views Refreshed**:
1. `station_usage` - Refresh station-specific usage data
2. `summary` - Refresh platform-wide summary (if station is top 10)

**Cache Keys Invalidated**:
- `station_{{station_id}}`
- `summary`
- `user_{{user_uuid}}` (if FAVORITE event)

**Implementation**:
```sql
-- Incremental refresh of station_usage
REFRESH MATERIALIZED VIEW station_usage;

-- Update metadata
UPDATE materialized_view_meta
SET last_refreshed_at = NOW()
WHERE view_name = 'station_usage';
```

### Search Trends Refresh

**Trigger**: SEARCH event

**Views Refreshed**:
1. `search_trends` - Refresh search query data

**Cache Keys Invalidated**:
- `search_{{query_text}}`
- `search_trends`

**Implementation**:
```sql
-- Incremental refresh of search_trends
REFRESH MATERIALIZED VIEW search_trends;

-- Update metadata
UPDATE materialized_view_meta
SET last_refreshed_at = NOW()
WHERE view_name = 'search_trends';
```

### User Activity Refresh

**Trigger**: LOGIN or LOGOUT event

**Views Refreshed**:
1. `user_activity` - Refresh user activity data

**Cache Keys Invalidated**:
- `user_{{user_uuid}}`
- `summary`

**Implementation**:
```sql
-- Incremental refresh of user_activity
REFRESH MATERIALIZED VIEW user_activity;

-- Update metadata
UPDATE materialized_view_meta
SET last_refreshed_at = NOW()
WHERE view_name = 'user_activity';
```

