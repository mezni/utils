## Circuit Breaker Implementation

**Location**: `admin-service/src/services/circuit_breaker.rs`

**Schema**:
```rust
use std::sync::atomic::{AtomicU32, Ordering};
use std::time::Duration;
use std::time::Instant;
use tokio::time::sleep;

pub struct CircuitBreaker {
    failure_count: AtomicU32,
    last_failure_time: AtomicInstant,
    state: Atomic<State>,
    max_failure_count: u32,
    circuit_open_duration: Duration,
}

enum State {
    Closed,      // Allow requests
    Open,        // Reject requests
    HalfOpen,    // Allow one trial request
}

impl CircuitBreaker {
    pub fn new(max_failure_count: u32, circuit_open_duration: Duration) -> Self {
        Self {
            failure_count: AtomicU32::new(0),
            last_failure_time: AtomicInstant::new(Instant::now()),
            state: Atomic::new(State::Closed),
            max_failure_count,
            circuit_open_duration,
        }
    }

    pub async fn call<F, R>(&self, f: F) -> Result<R, CircuitBreakerError>
    where
        F: FnOnce() -> Result<R, CircuitBreakerError>,
    {
        loop {
            match self.state.load(Ordering::Relaxed) {
                State::Closed => {
                    let result = f();
                    self.on_result(&result)?;
                    return result;
                }
                State::Open => {
                    // Check if circuit can be closed
                    if self.can_close() {
                        self.state.store(State::HalfOpen, Ordering::Relaxed);
                        continue;
                    } else {
                        sleep(self.circuit_open_duration).await;
                    }
                }
                State::HalfOpen => {
                    let result = f();
                    self.on_result(&result)?;
                    return result;
                }
            }
        }
    }

    fn on_result(&self, result: &Result<(), CircuitBreakerError>) {
        match result {
            Ok(()) => {
                self.failure_count.store(0, Ordering::Relaxed);
                self.last_failure_time.store(Instant::now());
                if self.state.load(Ordering::Relaxed) == State::HalfOpen {
                    self.state.store(State::Closed, Ordering::Relaxed);
                }
            }
            Err(_) => {
                self.failure_count.fetch_add(1, Ordering::Relaxed);
                self.last_failure_time.store(Instant::now());
                self.state.store(State::Open, Ordering::Relaxed);
            }
        }
    }

    fn can_close(&self) -> bool {
        let failure_count = self.failure_count.load(Ordering::Relaxed);
        let time_since_last_failure = self.last_failure_time.load().elapsed();
        failure_count < self.max_failure_count && time_since_last_failure >= self.circuit_open_duration
    }
}

#[derive(Debug, thiserror::Error)]
pub enum CircuitBreakerError {
    #[error("Circuit is open, rejecting request")]
    CircuitOpen,
    #[error("Internal error: {0}")]
    Internal(#[from] Box<dyn std::error::Error + Send + Sync>),
}

struct AtomicInstant(Instant);

impl AtomicInstant {
    fn new(instant: Instant) -> Self {
        AtomicInstant(instant)
    }

    fn load(&self, _ordering: Ordering) -> Instant {
        self.0
    }

    fn store(&self, instant: Instant, _ordering: Ordering) {
        self.0 = instant;
    }
}
```

