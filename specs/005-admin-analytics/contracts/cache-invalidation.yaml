## Driver-Service Integration

**Location**: `driver-service/src/ingestion/handler.rs`

**Implementation**:
```rust
pub async fn ingest_event(&self, event: AnalyticsEvent) -> Result<IngestionResult, IngestionError> {
    // 1. Write event to database
    self.db_writer.write_event(&event).await?;

    // 2. Invalidate cache via callback
    self.notify_cache_invalidation(event).await?;

    Ok(IngestionResult::Success)
}

async fn notify_cache_invalidation(&self, event: AnalyticsEvent) -> Result<(), IngestionError> {
    let request = CacheInvalidationRequest {
        station_id: event.station_id.clone(),
        user_uuid: event.user_uuid.clone(),
        event_type: match &event.event_type {
            EventType::VIEW => EventType::VIEW,
            EventType::FAVORITE => EventType::FAVORITE,
            EventType::SEARCH => EventType::SEARCH,
            EventType::LOGIN => EventType::LOGIN,
            EventType::LOGOUT => EventType::LOGOUT,
        },
        timestamp: event.timestamp,
    };

    // Retry with exponential backoff
    let response = retry_with_circuit_breaker(
        self.config.cache_invalidation_url.clone(),
        request,
        3,
        Duration::from_secs(1),
        Duration::from_secs(5),
    ).await?;

    if !response.success {
        return Err(IngestionError::CacheInvalidationFailed {
            error: "Cache invalidation returned success: false",
        });
    }

    Ok(())
}
```

