### 4. Search Trends

**Endpoint**: `GET /api/v1/analytics/search-trends`

**Description**: Retrieves top search queries and trends based on search volume.

**Authentication**: Required

**Request**:
```http
GET /api/v1/analytics/search-trends?limit=10&partner_id=STX-xxx
Authorization: Bearer <jwt_token>
```

**Parameters**:
| Parameter | Type | Required | Description |
|-----------|------|----------|-------------|
| `limit` | integer | Optional | Number of trends to return (default: 10, max: 50) |
| `partner_id` | string | Optional | Filter by partner (defaults to admin access to all) |

**Success Response (200 OK)**:
