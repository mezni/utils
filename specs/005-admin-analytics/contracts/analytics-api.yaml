## Error Responses

### Common Error Codes

| Code | Description |
|------|-------------|
| `401 Unauthorized` | Invalid or expired JWT token |
| `403 Forbidden` | Insufficient permissions to access analytics data |
| `404 Not Found` | Resource not found |
| `422 Unprocessable Entity` | Invalid query parameters |
| `500 Internal Server Error` | Server error |

---

## Query Parameters Validation

### Pagination
- `page`: Must be >= 1
- `per_page`: Must be between 1 and 100

### Date Range
- `start_date`: Must be valid ISO 8601 date format
- `end_date`: Must be valid ISO 8601 date format
- `start_date` <= `end_date`

### Partner ID
- Must follow PREFIX-nanoid(12) format
- For admin role, partner_id is ignored (full access)

---

## Rate Limiting

All endpoints are rate-limited:
- **Rate**: 100 requests per minute per user
- **Burst**: 20 requests per burst

**Header**: `X-RateLimit-Limit: 100`
**Header**: `X-RateLimit-Remaining: 95`
**Header**: `X-RateLimit-Reset: 1625226000`

---

## CORS

CORS is enabled for the following origins:
- `https://admin.bornemap.tn`
- `https://dashboard.bornemap.tn`

**Allowed Methods**: GET, OPTIONS

---

## Versioning

Current version: **v1**

Future versions will follow: `/api/v2/...`

Backwards compatibility: Guaranteed for v1

---

## Monitoring

All endpoints emit metrics:
- `analytics_requests_total` (counter)
- `analytics_request_duration_seconds` (histogram)
- `cache_hits_total` (counter)
- `cache_misses_total` (counter)
- `cache_invalidations_total` (counter)

**Metrics Endpoint**: `/metrics/analytics`

---

## Security

### Authentication Flow
1. Client obtains JWT from Keycloak
2. Client includes JWT in Authorization header
3. Server validates JWT signature and expiration
4. Server checks user roles (admin/manager)
5. Server enforces partner isolation if applicable

### Authorization Rules
- `admin` role: Full access to all analytics endpoints
- `manager` role: Access to own partner's analytics only
- Other roles: No access

### Data Protection
- All data encrypted in transit (HTTPS)
- No sensitive data in cache (hashed)
- No personal identifiable information (PII) exposed in public APIs

