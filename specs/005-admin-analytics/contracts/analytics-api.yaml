# API Contract: Admin Analytics Endpoints

**Feature**: Admin Analytics Read Layer
**Version**: 1.0.0
**Format**: OpenAPI 3.0.3
**Base Path**: `/api/v1`

---

## Authentication

All endpoints require Keycloak JWT authentication.

**Header**: `Authorization: Bearer <jwt_token>`

---

## Overview

This contract defines the analytics read API endpoints provided by admin-service. All endpoints are read-only (GET methods only) and enforce strict authentication and authorization.

---

## Endpoints

### 1. Platform-wide Analytics Summary

**Endpoint**: `GET /api/v1/analytics/summary`

**Description**: Retrieves platform-wide KPI aggregation including station_views, search_volume, favorite_count, and active_users.

**Authentication**: Required

**Request**:
```http
GET /api/v1/analytics/summary?partner_id=STX-xxx
Authorization: Bearer <jwt_token>
```

**Parameters**:
| Parameter | Type | Required | Description |
|-----------|------|----------|-------------|
| `partner_id` | string | Optional | Filter analytics by partner (defaults to admin access to all) |

**Success Response (200 OK)**:
```json
{
  "data": {
    "station_views": 1250000,
    "search_volume": 85000,
    "favorite_count": 45000,
    "active_users": 42000,
    "total_stations": 1250,
    "total_users": 58000,
    "total_searches": 92000,
    "trends": [
      "fast charging near me",
      "stations with supercharger",
      "electric vehicle charging points"
    ]
  },
  "metadata": {
    "request_id": "req_abc123",
    "query_duration_ms": 45,
    "timestamp": "2026-06-22T15:30:00Z",
    "cached": false,
    "cache_hit_rate": 0.75
  },
  "cache_status": {
    "status": "miss",
    "latency_ms": 45,
    "ttl_remaining_seconds": null
  }
}
```

**Error Response (401 Unauthorized)**:
```json
{
  "error": "unauthorized",
  "message": "Invalid or expired JWT token"
}
```

**Error Response (403 Forbidden)**:
```json
{
  "error": "forbidden",
  "message": "Insufficient permissions to access analytics data"
}
```

**Error Response (500 Internal Server Error)**:
```json
{
  "error": "internal_error",
  "message": "Failed to retrieve analytics data"
}
```

