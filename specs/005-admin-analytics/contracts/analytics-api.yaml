### 2. Station Analytics (Station Intelligence)

**Endpoint**: `GET /api/v1/analytics/stations/:station_id`

**Description**: Retrieves station-specific analytics including views, favorites, search hits, and session statistics.

**Authentication**: Required

**Request**:
```http
GET /api/v1/analytics/stations/STA-abc123def456?partner_id=STX-xxx
Authorization: Bearer <jwt_token>
```

**Parameters**:
| Parameter | Type | Required | Description |
|-----------|------|----------|-------------|
| `partner_id` | string | Optional | Filter by partner (defaults to admin access to all) |

**Success Response (200 OK)**:
```json
{
