## Entity: KPIIntegrityCheck

**Purpose**: Validates that all KPIs are derived from telemetry events only (no external data sources)

**Location**: `domain-types/src/analytics/kpi.rs`

**Schema**:
```rust
use serde::{Deserialize, Serialize};

#[derive(Debug, Clone, Serialize, Deserialize)]
pub struct KPIIntegrityCheck {
    pub passed: bool,
    pub violations: Vec<Violation>,
    pub check_timestamp: String,
}

#[derive(Debug, Clone, Serialize, Deserialize)]
pub struct Violation {
    pub kpi_name: String,
    pub source: String,
    pub reason: String,
}

impl KPIIntegrityCheck {
    pub fn new(passed: bool) -> Self {
        Self {
            passed,
            violations: Vec::new(),
            check_timestamp: Utc::now().to_rfc3339(),
        }
    }

    pub fn add_violation(&mut self, kpi_name: String, source: String, reason: String) {
        self.violations.push(Violation {
            kpi_name,
            source,
            reason,
        });
    }

    pub fn is_valid(&self) -> bool {
        self.passed && self.violations.is_empty()
    }
}
```

**Validation Rules**:
- KPIs must be derived from `analytics_events` table
- No hardcoded values in KPI calculations
- No external API calls in KPI calculations
- No dynamic SQL for KPI calculations
- All KPI fields must be derived from event payloads

