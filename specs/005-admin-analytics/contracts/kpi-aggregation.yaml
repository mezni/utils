## Entity: KPICalculation

**Purpose**: Represents a KPI calculation request with filtering parameters

**Location**: `domain-types/src/analytics/kpi.rs`

**Schema**:
```rust
use serde::{Deserialize, Serialize};

#[derive(Debug, Clone, Serialize, Deserialize)]
pub struct KPICalculation {
    pub kpi_name: KPIName,
    pub filters: Option<KPIFilters>,
    pub aggregations: Vec<KPIAggregation>,
    pub timestamp: String,
}

#[derive(Debug, Clone, Serialize, Deserialize, PartialEq)]
pub enum KPIName {
    StationViews,
    SearchVolume,
    FavoriteCount,
    ActiveUsers,
    AvgSessionTime,
    UniqueUsers,
    TotalStations,
}

#[derive(Debug, Clone, Serialize, Deserialize)]
pub struct KPIFilters {
    pub partner_id: Option<String>,
    pub station_id: Option<String>,
    pub user_uuid: Option<String>,
    pub date_range: Option<DateRange>,
    pub event_type: Option<String>,
}

#[derive(Debug, Clone, Serialize, Deserialize)]
pub struct KPIAggregation {
    pub function: String,  // "SUM", "COUNT", "AVG", "MAX", "MIN"
    pub field: String,
    pub alias: String,
}

#[derive(Debug, Clone, Serialize, Deserialize)]
pub struct DateRange {
    pub start: String,
    pub end: String,
}

impl KPICalculation {
    pub fn validate(&self) -> Result<(), ValidationError> {
        match &self.kpi_name {
            KPIName::StationViews => self.validate_station_views(),
            KPIName::SearchVolume => self.validate_search_volume(),
            KPIName::FavoriteCount => self.validate_favorite_count(),
            KPIName::ActiveUsers => self.validate_active_users(),
            KPIName::AvgSessionTime => self.validate_avg_session_time(),
            KPIName::UniqueUsers => self.validate_unique_users(),
            KPIName::TotalStations => self.validate_total_stations(),
        }
    }

    fn validate_station_views(&self) -> Result<(), ValidationError> {
        if let Some(filters) = &self.filters {
            if filters.event_type.is_some() && filters.event_type != Some("VIEW".to_string()) {
                return Err(ValidationError::InvalidEventForKPI {
                    kpi: "StationViews".to_string(),
                    invalid_event_type: filters.event_type.clone().unwrap(),
                });
            }
        }
        Ok(())
    }

    fn validate_search_volume(&self) -> Result<(), ValidationError> {
        if let Some(filters) = &self.filters {
            if filters.event_type.is_some() && filters.event_type != Some("SEARCH".to_string()) {
                return Err(ValidationError::InvalidEventForKPI {
                    kpi: "SearchVolume".to_string(),
                    invalid_event_type: filters.event_type.clone().unwrap(),
                });
            }
        }
        Ok(())
    }

    // ... other validation methods
}
```

**Validation Rules**:
- `StationViews` requires `event_type = "VIEW"`
- `SearchVolume` requires `event_type = "SEARCH"`
- `FavoriteCount` requires `event_type = "FAVORITE"`
- `DateRange.start` <= `DateRange.end`
- `partner_id` must follow PREFIX-nanoid(12) format if provided
- `station_id` must follow PREFIX-nanoid(12) format if provided

