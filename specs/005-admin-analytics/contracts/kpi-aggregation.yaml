## Entity: KPISummary

**Purpose**: Represents aggregated KPI summary across multiple dimensions

**Location**: `domain-types/src/analytics/kpi.rs`

**Schema**:
```rust
use serde::{Deserialize, Serialize};
use std::collections::HashMap;

#[derive(Debug, Clone, Serialize, Deserialize)]
pub struct KPISummary {
    pub kpi_name: KPIName,
    pub metrics: HashMap<String, f64>,
    pub breakdowns: Vec<KPIDimension>,
    pub timestamp: String,
}

#[derive(Debug, Clone, Serialize, Deserialize)]
pub struct KPIDimension {
    pub dimension: String,
    pub value: String,
    pub count: i64,
    pub average: f64,
}

impl KPISummary {
    pub fn new(kpi_name: KPIName, metrics: HashMap<String, f64>) -> Self {
        Self {
            kpi_name,
            metrics,
            breakdowns: Vec::new(),
            timestamp: Utc::now().to_rfc3339(),
        }
    }

    pub fn add_breakdown(&mut self, dimension: String, value: String, count: i64, average: f64) {
        self.breakdowns.push(KPIDimension {
            dimension,
            value,
            count,
            average,
        });
    }
}
```

**Fields**:
- `kpi_name`: KPI name
- `metrics`: Map of dimension to KPI value
- `breakdowns`: List of breakdowns by dimension (e.g., by partner, by station)
- `timestamp`: Summary calculation timestamp

**Example**:
```rust
let mut summary = KPISummary::new(
    KPIName::StationViews,
    HashMap::from([
        ("total_views".to_string(), 1250000.0),
        ("unique_users".to_string(), 42000.0),
        ("favorite_count".to_string(), 45000.0),
    ])
);
summary.add_breakdown("partner_id".to_string(), "STX-xxx".to_string(), 1250000, 10000.0);
```

