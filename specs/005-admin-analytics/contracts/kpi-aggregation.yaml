## Entity: KPIAggregationEngine

**Purpose**: Core engine for calculating KPIs from events and materialized views

**Location**: `domain-types/src/analytics/kpi.rs`

**Schema**:
```rust
pub struct KPIAggregationEngine {
    config: KPIConfig,
}

#[derive(Debug, Clone, Serialize, Deserialize)]
pub struct KPIConfig {
    pub max_kpi_calculation_duration_ms: u64,
    pub enable_integrity_check: bool,
    pub cache_enabled: bool,
}

impl KPIAggregationEngine {
    pub fn new(config: KPIConfig) -> Self {
        Self { config }
    }

    pub async fn calculate_station_views(&self, filters: KPIFilters) -> Result<f64, KPIError> {
        // Validate filters
        filters.validate()?;

        // Check cache if enabled
        if self.config.cache_enabled {
            if let Some(cached) = cache_service.get("station_views").await? {
                return Ok(cached);
            }
        }

        // Calculate from materialized view
        let value = db::queries::station_usage::get_total_views(filters).await?;

        // Cache result
        if self.config.cache_enabled {
            cache_service.set("station_views", value, CACHE_TTL_SUMMARY).await?;
        }

        Ok(value)
    }

    pub async fn calculate_search_volume(&self, filters: KPIFilters) -> Result<f64, KPIError> {
        // Validation for search volume
        filters.validate()?;

        // Check cache
        if self.config.cache_enabled {
            if let Some(cached) = cache_service.get("search_volume").await? {
                return Ok(cached);
            }
        }

        // Calculate from materialized view
        let value = db::queries::search_trends::get_total_searches(filters).await?;

        // Cache result
        if self.config.cache_enabled {
            cache_service.set("search_volume", value, CACHE_TTL_SUMMARY).await?;
        }

        Ok(value)
    }

    pub async fn calculate_favorite_count(&self, filters: KPIFilters) -> Result<f64, KPIError> {
        // Validation for favorite count
        filters.validate()?;

        // Check cache
        if self.config.cache_enabled {
            if let Some(cached) = cache_service.get("favorite_count").await? {
                return Ok(cached);
            }
        }

        // Calculate from materialized view
        let value = db::queries::station_usage::get_total_favorites(filters).await?;

        // Cache result
        if self.config.cache_enabled {
            cache_service.set("favorite_count", value, CACHE_TTL_SUMMARY).await?;
        }

        Ok(value)
    }

    pub async fn calculate_active_users(&self, filters: KPIFilters) -> Result<f64, KPIError> {
        // Validation for active users
        filters.validate()?;

        // Check cache
        if self.config.cache_enabled {
            if let Some(cached) = cache_service.get("active_users").await? {
                return Ok(cached);
            }
        }

        // Calculate from materialized view
        let value = db::queries::user_activity::get_unique_users(filters).await?;

        // Cache result
        if self.config.cache_enabled {
            cache_service.set("active_users", value, CACHE_TTL_SUMMARY).await?;
        }

        Ok(value)
    }

    pub async fn validate_kpi_integrity(&self) -> KPIIntegrityCheck {
        // Check that all KPIs are derived from events only
        let mut integrity_check = KPIIntegrityCheck::new(true);

        // Scan KPI calculations for external data sources
        // Verify no hardcoded values
        // Verify no dynamic SQL

        integrity_check
    }
}

#[derive(Debug, thiserror::Error)]
pub enum KPIError {
    #[error("Database error: {0}")]
    Database(#[from] sqlx::Error),
    #[error("Cache error: {0}")]
    Cache(#[from] redis::RedisError),
    #[error("Invalid filter: {0}")]
    InvalidFilter(String),
    #[error("Integrity violation: {0}")]
    IntegrityViolation(String),
}
```

