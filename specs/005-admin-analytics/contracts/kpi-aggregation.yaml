# Contract: KPI Aggregation Engine

**Feature**: Admin Analytics Read Layer
**Version**: 1.0.0
**Type**: Domain Types Contract
**Location**: `domain-types/src/analytics/`

---

## Overview

This contract defines the KPI aggregation engine domain types. The KPI engine calculates key performance indicators (station_views, search_volume, favorite_count, active_users) from telemetry events and materialized views.

---

## Entity: KPI

**Purpose**: Represents a single KPI metric with derived value and metadata

**Location**: `domain-types/src/analytics/kpi.rs`

**Schema**:
```rust
use chrono::{DateTime, Utc};

#[derive(Debug, Clone, Serialize, Deserialize)]
pub struct KPI {
    pub name: String,
    pub value: f64,
    pub unit: String,
    pub source: String,  // "station_usage", "user_activity", "search_trends"
    pub timestamp: DateTime<Utc>,
    pub derived_from: String,  // Event type or view name
}

impl KPI {
    pub fn new(name: String, value: f64, unit: String, source: String, derived_from: String) -> Self {
        Self {
            name,
            value,
            unit,
            source,
            timestamp: Utc::now(),
            derived_from,
        }
    }

    pub fn format_value(&self) -> String {
        match self.unit.as_str() {
            "count" => self.value.round() as i64.to_string(),
            "seconds" => format!("{:.2}", self.value),
            _ => self.value.to_string(),
        }
    }
}
```

**Fields**:
- `name`: KPI name (e.g., "station_views", "search_volume")
- `value`: KPI value as f64 (supports fractional values)
- `unit`: KPI unit (e.g., "count", "seconds")
- `source`: Source materialized view
- `timestamp`: KPI calculation timestamp
- `derived_from`: Event type or view name

**Derived Values**:
- `station_views`: COUNT(*) from events
- `search_volume`: COUNT(*) from search events
- `favorite_count`: COUNT(*) from favorite events
- `active_users`: COUNT(DISTINCT user_uuid) from events
- `avg_session_gap_seconds`: AVG(lead event_timestamp - event_timestamp)

