## Entity: KPIAggregationTask

**Purpose**: Represents a background task for refreshing KPIs

**Location**: `domain-types/src/analytics/kpi.rs`

**Schema**:
```rust
use chrono::{DateTime, Utc};

#[derive(Debug, Clone, Serialize, Deserialize)]
pub struct KPIAggregationTask {
    pub task_id: String,
    pub kpi_name: KPIName,
    pub filters: KPIFilters,
    pub status: TaskStatus,
    pub started_at: DateTime<Utc>,
    pub completed_at: Option<DateTime<Utc>>,
    pub result: Option<f64>,
}

#[derive(Debug, Clone, Serialize, Deserialize, PartialEq)]
pub enum TaskStatus {
    Pending,
    Running,
    Completed,
    Failed,
}

impl KPIAggregationTask {
    pub fn new(task_id: String, kpi_name: KPIName, filters: KPIFilters) -> Self {
        Self {
            task_id,
            kpi_name,
            filters,
            status: TaskStatus::Pending,
            started_at: Utc::now(),
            completed_at: None,
            result: None,
        }
    }

    pub fn start(&mut self) {
        self.status = TaskStatus::Running;
    }

    pub fn complete(&mut self, result: f64) {
        self.status = TaskStatus::Completed;
        self.completed_at = Some(Utc::now());
        self.result = Some(result);
    }

    pub fn fail(&mut self, error: String) {
        self.status = TaskStatus::Failed;
        self.completed_at = Some(Utc::now());
        self.result = None;
    }
}
```

---

## Error Types

### KPIError

**Variants**:
- `Database(sqlx::Error)`: Database query errors
- `Cache(redis::RedisError)`: Cache operation errors
- `InvalidFilter(String)`: Invalid filter parameters
- `IntegrityViolation(String)`: KPI calculation integrity violations

---

## Validation

All KPI calculations must pass validation:
1. Filter validation (date range, format, values)
2. KPI integrity check (no external data sources)
3. Query safety check (no dynamic SQL)
4. Cache validity check (cache not expired)

---

## Integration

### Materialized Views
- `station_usage`: Provides station_views, favorites, unique_users
- `user_activity`: Provides unique_users, total_views, stations_visited
- `search_trends`: Provides search_volume, unique_searchers

### Cache Layer
- Cache KPI calculations for 10 minutes (TTL)
- Invalidate cache on event ingestion
- Cache hit rate target: 80%+

### CI Gates
- KPI Integrity Gate: Ensures KPIs derived from events only
- Query Safety Gate: Prevents dynamic SQL
- Read-Only Enforcement Gate: Ensures no write operations

