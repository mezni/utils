openapi: 3.0.3
info:
  title: BorneMap API
  description: EV Infrastructure Dashboard Platform API
  version: 1.0.0
  contact:
    name: BorneMap API Support
    email: support@bornemap.com

servers:
  - url: http://localhost:8080/api/v1
    description: Local development server
  - url: https://api.bornemap.com/api/v1
    description: Production server

tags:
  - name: Dashboard
    description: Dashboard KPIs
  - name: Partners
    description: Partner management operations
  - name: Stations
    description: Station management operations
  - name: Chargers
    description: Charger management operations

paths:
  /dashboard/kpis:
    get:
      tags:
        - Dashboard
      summary: Get dashboard KPIs
      description: Retrieve aggregate counts for partners, stations, and chargers (only active records)
      operationId: getDashboardKPIs
      responses:
        '200':
          description: Dashboard KPIs retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardKPIsResponse'
              example:
                success: true
                data:
                  partners_count: 10
                  stations_count: 50
                  chargers_count: 200
                error: null
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /partners:
    get:
      tags:
        - Partners
      summary: List all active partners
      description: Retrieve paginated list of all active partners
      operationId: listPartners
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number (1-indexed)
          example: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
          description: Number of items per page
          example: 50
      responses:
        '200':
          description: Partners list retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerListResponse'
              example:
                success: true
                data:
                  items:
                    - id: "PRT-abc123456789"
                      name: "Example EV Network"
                      status: "ACTIVE"
                      is_valid: true
                      created_by: "admin-user-id"
                      updated_by: "admin-user-id"
                      created_at: "2026-06-23T10:00:00Z"
                      updated_at: "2026-06-23T10:00:00Z"
                  pagination:
                    page: 1
                    limit: 50
                    total: 10
                    pages: 1
                error: null
        '400':
          description: Bad request (invalid pagination parameters)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Partners
      summary: Create a new partner
      description: Create a new partner organization
      operationId: createPartner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePartnerRequest'
            example:
              name: "Example EV Network"
              status: "ACTIVE"
              is_valid: true
      responses:
        '201':
          description: Partner created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerResponse'
              example:
                success: true
                data:
                  id: "PRT-abc123456789"
                  name: "Example EV Network"
                  status: "ACTIVE"
                  is_valid: true
                  created_by: "admin-user-id"
                  updated_by: "admin-user-id"
                  created_at: "2026-06-23T10:00:00Z"
                  updated_at: "2026-06-23T10:00:00Z"
                error: null
        '400':
          description: Bad request (invalid input)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                data: null
                error:
                  code: VALIDATION_ERROR
                  message: Name cannot be empty or whitespace
        '409':
          description: Conflict (partner name already exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Partners
      summary: Hard delete a partner
      description: Hard delete a partner (CASCADE to stations). This permanently removes the partner and all associated stations.
      operationId: deletePartner
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Partner external ID (format: PRT-<12-char>)
          example: PRT-abc123456789
      responses:
        '204':
          description: Partner deleted successfully (no content)
        '404':
          description: Partner not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                data: null
                error:
                  code: NOT_FOUND
                  message: Partner not found
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /partners/{id}:
    get:
      tags:
        - Partners
      summary: Get partner by ID
      description: Retrieve a specific partner by its external ID
      operationId: getPartner
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Partner external ID (format: PRT-<12-char>)
          example: PRT-abc123456789
      responses:
        '200':
          description: Partner retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerResponse'
              example:
                success: true
                data:
                  id: "PRT-abc123456789"
                  name: "Example EV Network"
                  status: "ACTIVE"
                  is_valid: true
                  created_by: "admin-user-id"
                  updated_by: "admin-user-id"
                  created_at: "2026-06-23T10:00:00Z"
                  updated_at: "2026-06-23T10:00:00Z"
                error: null
        '404':
          description: Partner not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Partners
      summary: Soft delete or undelete a partner
      description: |
        - Soft delete: Set deleted_at timestamp (stations NOT automatically deleted)
        - Undelete: Remove deleted_at timestamp (partner becomes active again)
      operationId: softDeletePartner
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Partner external ID (format: PRT-<12-char>)
          example: PRT-abc123456789
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deleted_at:
                  type: string
                  format: date-time
                  description: ISO 8601 timestamp (null = undelete)
              example:
                deleted_at: "2026-06-23T10:00:00Z"
      responses:
        '200':
          description: Partner updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerResponse'
              example:
                success: true
                data:
                  id: "PRT-abc123456789"
                  name: "Example EV Network"
                  status: "ACTIVE"
                  is_valid: true
                  created_by: "admin-user-id"
                  updated_by: "admin-user-id"
                  created_at: "2026-06-23T10:00:00Z"
                  updated_at: "2026-06-23T10:00:00Z"
                  deleted_at: "2026-06-23T10:00:00Z"
                error: null
        '404':
          description: Partner not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /stations:
    get:
      tags:
        - Stations
      summary: List all active stations
      description: Retrieve paginated list of all active stations, optionally filtered by partner
      operationId: listStations
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number (1-indexed)
          example: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
          description: Number of items per page
          example: 50
        - in: query
          name: partner_id
          schema:
            type: string
          description: Optional: Filter stations by partner ID
          example: PRT-abc123456789
      responses:
        '200':
          description: Stations list retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationListResponse'
              example:
                success: true
                data:
                  items:
                    - id: "STA-xyz987654321"
                      name: "Downtown Station"
                      location: "123 Main Street, New York"
                      status: "ACTIVE"
                      partner_id: "PRT-abc123456789"
                      created_by: "admin-user-id"
                      updated_by: "admin-user-id"
                      created_at: "2026-06-23T10:30:00Z"
                      updated_at: "2026-06-23T10:30:00Z"
                  pagination:
                    page: 1
                    limit: 50
                    total: 10
                    pages: 1
                error: null
        '400':
          description: Bad request (invalid pagination parameters)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Partner not found (when partner_id specified)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Stations
      summary: Create a new station
      description: Create a new charging station linked to a specific partner
      operationId: createStation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStationRequest'
            example:
              name: "Downtown Station"
              location: "123 Main Street, New York"
              status: "ACTIVE"
              partner_id: "PRT-abc123456789"
      responses:
        '201':
          description: Station created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationResponse'
              example:
                success: true
                data:
                  id: "STA-xyz987654321"
                  name: "Downtown Station"
                  location: "123 Main Street, New York"
                  status: "ACTIVE"
                  partner_id: "PRT-abc123456789"
                  created_by: "admin-user-id"
                  updated_by: "admin-user-id"
                  created_at: "2026-06-23T10:30:00Z"
                  updated_at: "2026-06-23T10:30:00Z"
                error: null
        '400':
          description: Bad request (invalid input or missing partner_id)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                data: null
                error:
                  code: VALIDATION_ERROR
                  message: Partner ID is required
        '404':
          description: Partner not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                data: null
                error:
                  code: NOT_FOUND
                  message: Partner not found
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Stations
      summary: Hard delete a station
      description: Hard delete a station (CASCADE to chargers). This permanently removes the station and all associated chargers.
      operationId: deleteStation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Station external ID (format: STA-<12-char>)
          example: STA-xyz987654321
      responses:
        '204':
          description: Station deleted successfully (no content)
        '404':
          description: Station not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /stations/{id}:
    get:
      tags:
        - Stations
      summary: Get station by ID
      description: Retrieve a specific station by its external ID
      operationId: getStation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Station external ID (format: STA-<12-char>)
          example: STA-xyz987654321
      responses:
        '200':
          description: Station retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationResponse'
              example:
                success: true
                data:
                  id: "STA-xyz987654321"
                  name: "Downtown Station"
                  location: "123 Main Street, New York"
                  status: "ACTIVE"
                  partner_id: "PRT-abc123456789"
                  created_by: "admin-user-id"
                  updated_by: "admin-user-id"
                  created_at: "2026-06-23T10:30:00Z"
                  updated_at: "2026-06-23T10:30:00Z"
                error: null
        '404':
          description: Station not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Stations
      summary: Soft delete or undelete a station
      description: |
        - Soft delete: Set deleted_at timestamp (chargers NOT automatically deleted)
        - Undelete: Remove deleted_at timestamp (station becomes active again)
      operationId: softDeleteStation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Station external ID (format: STA-<12-char>)
          example: STA-xyz987654321
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deleted_at:
                  type: string
                  format: date-time
                  description: ISO 8601 timestamp (null = undelete)
              example:
                deleted_at: "2026-06-23T10:00:00Z"
      responses:
        '200':
          description: Station updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationResponse'
              example:
                success: true
                data:
                  id: "STA-xyz987654321"
                  name: "Downtown Station"
                  location: "123 Main Street, New York"
                  status: "ACTIVE"
                  partner_id: "PRT-abc123456789"
                  created_by: "admin-user-id"
                  updated_by: "admin-user-id"
                  created_at: "2026-06-23T10:30:00Z"
                  updated_at: "2026-06-23T10:30:00Z"
                  deleted_at: "2026-06-23T10:00:00Z"
                error: null
        '404':
          description: Station not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /chargers:
    get:
      tags:
        - Chargers
      summary: List all active chargers
      description: Retrieve paginated list of all active chargers, optionally filtered by station
      operationId: listChargers
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number (1-indexed)
          example: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
          description: Number of items per page
          example: 50
        - in: query
          name: station_id
          schema:
            type: string
          description: Optional: Filter chargers by station ID
          example: STA-xyz987654321
      responses:
        '200':
          description: Chargers list retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargerListResponse'
              example:
                success: true
                data:
                  items:
                    - id: "CHR-fee987654321"
                      station_id: "STA-xyz987654321"
                      status: "ACTIVE"
                      power_rating: 50
                      created_by: "admin-user-id"
                      updated_by: "admin-user-id"
                      created_at: "2026-06-23T11:00:00Z"
                      updated_at: "2026-06-23T11:00:00Z"
                  pagination:
                    page: 1
                    limit: 50
                    total: 10
                    pages: 1
                error: null
        '400':
          description: Bad request (invalid pagination parameters)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Station not found (when station_id specified)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Chargers
      summary: Create a new charger
      description: Create a new charging unit within a station
      operationId: createCharger
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChargerRequest'
            example:
              station_id: "STA-xyz987654321"
              status: "ACTIVE"
              power_rating: 50
      responses:
        '201':
          description: Charger created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargerResponse'
              example:
                success: true
                data:
                  id: "CHR-fee987654321"
                  station_id: "STA-xyz987654321"
                  status: "ACTIVE"
                  power_rating: 50
                  created_by: "admin-user-id"
                  updated_by: "admin-user-id"
                  created_at: "2026-06-23T11:00:00Z"
                  updated_at: "2026-06-23T11:00:00Z"
                error: null
        '400':
          description: Bad request (invalid input or missing station_id)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                data: null
                error:
                  code: VALIDATION_ERROR
                  message: Station ID is required
        '404':
          description: Station not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                data: null
                error:
                  code: NOT_FOUND
                  message: Station not found
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Chargers
      summary: Hard delete a charger
      description: Hard delete a charger (no cascade to children). This permanently removes the charger.
      operationId: deleteCharger
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Charger external ID (format: CHR-<12-char>)
          example: CHR-fee987654321
      responses:
        '204':
          description: Charger deleted successfully (no content)
        '404':
          description: Charger not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /chargers/{id}:
    get:
      tags:
        - Chargers
      summary: Get charger by ID
      description: Retrieve a specific charger by its external ID
      operationId: getCharger
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Charger external ID (format: CHR-<12-char>)
          example: CHR-fee987654321
      responses:
        '200':
          description: Charger retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargerResponse'
              example:
                success: true
                data:
                  id: "CHR-fee987654321"
                  station_id: "STA-xyz987654321"
                  status: "ACTIVE"
                  power_rating: 50
                  created_by: "admin-user-id"
                  updated_by: "admin-user-id"
                  created_at: "2026-06-23T11:00:00Z"
                  updated_at: "2026-06-23T11:00:00Z"
                error: null
        '404':
          description: Charger not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    DashboardKPIsResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required:
            - partners_count
            - stations_count
            - chargers_count
          properties:
            partners_count:
              type: integer
              minimum: 0
              description: Total number of active partner organizations
              example: 10
            stations_count:
              type: integer
              minimum: 0
              description: Total number of active charging stations
              example: 50
            chargers_count:
              type: integer
              minimum: 0
              description: Total number of active charging units
              example: 200
        error:
          $ref: '#/components/schemas/AppError'

    PartnerResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Partner'
        error:
          $ref: '#/components/schemas/AppError'

    PartnerListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Partner'
            pagination:
              $ref: '#/components/schemas/Pagination'
        error:
          $ref: '#/components/schemas/AppError'

    Partner:
      type: object
      properties:
        id:
          type: string
          example: "PRT-abc123456789"
        name:
          type: string
          example: "Example EV Network"
        status:
          type: string
          enum: [ACTIVE, INACTIVE, MAINTENANCE, DISABLED]
          example: "ACTIVE"
        is_valid:
          type: boolean
          example: true
        created_by:
          type: string
          example: "admin-user-id"
        updated_by:
          type: string
          example: "admin-user-id"
        created_at:
          type: string
          format: date-time
          example: "2026-06-23T10:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-06-23T10:00:00Z"
        deleted_at:
          type: string
          format: date-time
          nullable: true
          example: null

    CreatePartnerRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '^[a-zA-Z0-9\\s-]+$'
          example: "Example EV Network"
        status:
          type: string
          enum: [ACTIVE, INACTIVE, MAINTENANCE, DISABLED]
          default: "ACTIVE"
          example: "ACTIVE"
        is_valid:
          type: boolean
          default: true
          example: true

    CreateStationRequest:
      type: object
      required:
        - name
        - partner_id
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '^[a-zA-Z0-9\\s-]+$'
          example: "Downtown Station"
        location:
          type: string
          example: "123 Main Street, New York"
        status:
          type: string
          enum: [ACTIVE, INACTIVE, MAINTENANCE, DISABLED]
          default: "ACTIVE"
          example: "ACTIVE"
        partner_id:
          type: string
          minLength: 18
          pattern: '^PRT-[A-Za-z0-9]{12}$'
          example: "PRT-abc123456789"

    CreateChargerRequest:
      type: object
      required:
        - station_id
        - power_rating
      properties:
        station_id:
          type: string
          minLength: 18
          pattern: '^STA-[A-Za-z0-9]{12}$'
          example: "STA-xyz987654321"
        status:
          type: string
          enum: [ACTIVE, INACTIVE, MAINTENANCE, DISABLED]
          default: "ACTIVE"
          example: "ACTIVE"
        power_rating:
          type: integer
          minimum: 1
          maximum: 1000
          example: 50

