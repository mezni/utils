[package]
name = "driver-service"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"

[dependencies]
# Web framework
actix-web = "4.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
ev-core = { path = "../../crates/ev-core" }
ev-db = { path = "../../crates/ev-db" }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "tls-rustls"] }

# Configuration
dotenv = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "1.0"

# UUID
uuid = { version = "1.5", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1.28", features = ["test-util"] }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3

[build-dependencies]
built = "0.7"
