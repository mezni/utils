[package]
name = "auth-service"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

bornemap-core = { path = "../../shared/bornemap-core" }
bornemap-auth = { path = "../../shared/bornemap-auth" }
bornemap-db = { path = "../../shared/bornemap-db" }
