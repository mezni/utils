[package]
name = "auth-service"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
argon2 = "0.5"
async-trait = "0.1"
bornemap-auth = { path = "../../shared/bornemap-auth" }
bornemap-core = { path = "../../shared/bornemap-core" }
bornemap-db = { path = "../../shared/bornemap-db" }
chrono = "0.4"
futures = "0.3"
reqwest = { version = "0.11", features = ["json"], default-features = false }
redis = { version = "0.24", features = ["tokio-comp", "json"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_urlencoded = "0.7"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-native-tls", "postgres", "uuid", "chrono"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
serde_json = "1"
