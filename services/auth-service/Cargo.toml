[package]
name = "auth-service"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Authentication and user profile management service (Port 3000)"

[lib]
name = "auth_service"
path = "src/lib.rs"

[[bin]]
name = "auth-service"
path = "src/main.rs"

[dependencies]
# Web framework
actix-web = { workspace = true }
actix-cors = { workspace = true }

# Database
sqlx = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

# Validation
validator = { workspace = true }

# Configuration
config = { workspace = true }

# Concurrency
tokio = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Workspace packages
domain-types = { path = "../../apps/packages/domain-types" }

# JWT validation
jsonwebtoken = { workspace = true }
reqwest = { workspace = true }
uuid = { workspace = true }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

[dev-dependencies]
