[server]
# Service port (MUST be 3000 for auth-service)
port = 3000
host = "0.0.0.0"

# Database configuration
database.url = "postgresql://bornemap_admin:bornemap_password@localhost:5432/platform_db"
database.pool.max_size = 10
database.pool.min_idle = 2

# Logging configuration
logging.level = "info"
logging.format = "json"

# CORS configuration
cors.enabled = true
cors.allowed_origins = ["*"]
cors.allowed_methods = ["GET", "POST", "PUT", "DELETE"]
cors.allowed_headers = ["*"]
cors.expose_headers = ["Content-Type"]
