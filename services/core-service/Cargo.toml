[package]
name = "core-service"
version = "0.1.0"
edition = "2021"
authors = ["BorneMap Team"]
description = "Core service for BorneMap EV charging platform"

[dependencies]
# Web framework
actix-web = "4.4"
actix-http = "3.4"
actix-service = "2.0"

# Database
sqlx = { version = "0.7", features = [
    "runtime-tokio-rustls",
    "postgres",
    "chrono",
    "uuid",
    "json",
    "migrate",
    "macros"
] }

# Use rustls instead of native-tls
rustls = "0.21"
rustls-pemfile = "1.0"

# Authentication
jsonwebtoken = "8.3"
oauth2 = "4.4"

# Validation
validator = { version = "0.16", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Documentation
utoipa = { version = "4.2", features = ["actix_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "6.0", features = ["actix-web"] }

# Testing
tokio-test = "0.4"

# Events
lapin = "2.3"
tokio-executor-trait = "2.1"

# Configuration
config = "0.13"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-actix-web = "0.7"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["serde", "v4"] }
nanoid = "0.4"

# HTTP client
hyper = { version = "0.14", features = ["full"] }
hyper-rustls = "0.24"
tower = "0.4"

# Metrics
prometheus = "0.13"

[dev-dependencies]
# Testing
testcontainers = "0.15"
testcontainers-modules = { version = "0.3", features = ["postgres", "rabbitmq"] }
mockall = "0.11"
fake = { version = "2.9", features = ["derive", "chrono", "uuid"] }

# Integration testing
actix-rt = "2.9"

[lib]
name = "core_service"
path = "src/lib.rs"

[[bin]]
name = "core-service"
path = "src/main.rs"

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true

[profile.release]
opt-level = 3
debug = false
lto = true
codegen-units = 1
panic = "abort"

[profile.test]
opt-level = 1
debug = true
overflow-checks = true