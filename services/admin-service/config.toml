[server]
# Service port (MUST be 3002 for admin-service)
port = 3002
host = "0.0.0.0"

# Database configuration
database.url = "postgresql://bornemap_admin:bornemap_password@localhost:5432/platform_db"
database.pool.max_size = 10
database.pool.min_idle = 2

# Analytics database configuration (read-only)
analytics_database.url = "postgresql://bornemap_analytics_reader:bornemap_password@localhost:5433/analytics_db"
analytics_database.pool.max_size = 5
analytics_database.pool.min_idle = 2

# Logging configuration
logging.level = "info"
logging.format = "json"

# CORS configuration
cors.enabled = true
cors.allowed_origins = ["*"]
cors.allowed_methods = ["GET", "POST", "PUT", "DELETE"]
cors.allowed_headers = ["*"]
cors.expose_headers = ["Content-Type"]
