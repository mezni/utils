[package]
name = "client-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Transport-only package for API clients, auth, and mappers (NO backend framework dependencies)"

[lib]
name = "client_core"
path = "src/lib.rs"

[dependencies]
# Only transport dependencies, NO web framework
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
tokio = { workspace = true }
anyhow = "1.0"
thiserror = "1.0"

[dev-dependencies]
# Mock testing only
mockito = "1.2"
tokio = { workspace = true }
